<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>캐논 힐</title>
<style>
  @font-face { font-family: "Gaegu"; font-style: normal; font-weight: 400; font-display: swap; src: url("/games/fonts/gaegu-400.woff2") format("woff2"); }
  @font-face { font-family: "Gaegu"; font-style: normal; font-weight: 700; font-display: swap; src: url("/games/fonts/gaegu-700.woff2") format("woff2"); }
</style>
<style>
  /* Layout concept: a doodled artillery duel on paper. Ink outlines on everything, destructible hills, controls in a bottom bar, aim by dragging anywhere. */
  :root {
    --bg: #fdfdfb; --ink: #1c2331; --muted: #6a7282; --hit: #e5484d;
    --sky1: #bfe3ff; --sky2: #f4fbff; --hill1: #d3ebda; --hill2: #b9dec6; --cloud: #ffffff;
    --grass: #7ecb6b; --dirt: #d9b98c; --coin: #ffd23f; --mine: #2bb3a8; --foe: #f0803c; --heart: #ff5d8f; --sun: #ffe08a;
    --font-hand: "Gaegu", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171f; --ink: #e8ebf2; --muted: #98a1b3; --hit: #ff6b70;
      --sky1: #0d1530; --sky2: #1c2b55; --hill1: #1d3a40; --hill2: #17303a; --cloud: #8a96c0;
      --grass: #3f8f4f; --dirt: #6b5236; --coin: #ffcf3a; --mine: #1f948b; --foe: #e0702f; --heart: #ff6b9c; --sun: #dfe6ff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171f; --ink: #e8ebf2; --muted: #98a1b3; --hit: #ff6b70;
    --sky1: #0d1530; --sky2: #1c2b55; --hill1: #1d3a40; --hill2: #17303a; --cloud: #8a96c0;
    --grass: #3f8f4f; --dirt: #6b5236; --coin: #ffcf3a; --mine: #1f948b; --foe: #e0702f; --heart: #ff6b9c; --sun: #dfe6ff;
    color-scheme: dark;
  }

  html, body { height: 100%; }
  html { overscroll-behavior: none; }
  body {
    margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: var(--font-hand); overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: relative; width: 100%; max-width: 480px; height: 100%;
    margin: 0 auto; touch-action: none; overflow: hidden; background: var(--sky2);
    border-left: 1px solid color-mix(in srgb, var(--ink) 12%, transparent);
    border-right: 1px solid color-mix(in srgb, var(--ink) 12%, transparent);
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  #hud {
    position: absolute; inset: 0 0 auto 0; display: flex; justify-content: space-between; align-items: flex-start;
    padding-top: 12px; pointer-events: none; font-weight: 700; line-height: 1.05; z-index: 3;
  }
  #hud .nums { font-size: 32px; font-variant-numeric: tabular-nums; text-shadow: 0 0 6px var(--sky2), 0 0 2px var(--sky2); }
  #hud .nums small { font-size: 17px; font-weight: 400; margin-left: 6px; opacity: .75; }
  #hud .sub { font-size: 20px; font-weight: 400; margin-top: 2px; text-shadow: 0 0 6px var(--sky2), 0 0 2px var(--sky2); }
  #hud .right { text-align: right; font-size: 18px; font-weight: 400; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; text-shadow: 0 0 6px var(--sky2); }
  #hud .btns { display: flex; gap: 8px; }
  #pauseBtn, #soundBtn {
    pointer-events: auto; font: inherit; font-size: 18px; color: var(--ink); background: color-mix(in srgb, var(--bg) 70%, transparent);
    border: 2px solid var(--ink); border-radius: 999px; padding: 2px 14px; cursor: pointer;
  }
  #soundBtn[aria-pressed="false"] { color: var(--muted); border-color: var(--muted); }
  #toast {
    position: absolute; left: 0; right: 0; top: 26%; text-align: center; pointer-events: none; z-index: 4;
    font-size: 34px; padding: 0 12px; word-break: keep-all; font-weight: 700; color: var(--ink); opacity: 0; transform: scale(.9);
    transition: opacity .25s, transform .25s; text-shadow: 0 3px 0 var(--hit), 0 0 8px var(--bg), 0 0 3px var(--bg);
  }
  #toast.show { opacity: 1; transform: scale(1); }

  #bar {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 1; display: flex; gap: 6px; align-items: stretch;
    padding-top: 8px; padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
    background: color-mix(in srgb, var(--bg) 82%, transparent); border-top: 2px solid var(--ink);
  }
  #bar .grp { display: flex; gap: 6px; }
  #bar .gap { flex: 1; }
  .tb {
    font: inherit; font-size: 20px; font-weight: 700; color: var(--ink); background: var(--bg); cursor: pointer;
    border: 2px solid var(--ink); border-radius: 12px; padding: 6px 8px; min-width: 44px; line-height: 1.05; touch-action: none;
  }
  .tb small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
  .tb.on { background: var(--ink); color: var(--bg); }
  .tb.on small { color: var(--bg); opacity: .8; }
  .tb:disabled { opacity: .35; cursor: default; }
  #bar .mv { display: flex; flex-direction: column; }
  #fuel { height: 5px; border-radius: 3px; background: color-mix(in srgb, var(--ink) 18%, transparent); margin-top: 4px; overflow: hidden; }
  #fuelFill { height: 100%; width: 100%; background: var(--grass); }

  #panel {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 2; pointer-events: none;
    background: color-mix(in srgb, var(--bg) 45%, transparent);
  }
  #panel[hidden] { display: none; }
  .card {
    width: min(100%, 340px); box-sizing: border-box; text-align: center; pointer-events: auto;
    background: var(--bg); border: 2px solid var(--ink); border-radius: 18px;
    box-shadow: 5px 5px 0 var(--ink); padding: 22px 20px 20px;
  }
  .card h1 { margin: 0 0 6px; font-size: 40px; line-height: 1.05; text-wrap: balance; }
  .card p { word-break: keep-all; margin: 6px 0; font-size: 20px; line-height: 1.3; color: var(--muted); text-wrap: balance; }
  .card .big { font-size: 46px; font-weight: 700; color: var(--ink); line-height: 1; margin: 10px 0 4px; font-variant-numeric: tabular-nums; }
  .card .row { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 18px; font-size: 20px; color: var(--ink); margin: 6px 0 2px; }
  .card .badge { display: inline-block; margin-top: 4px; padding: 0 12px; border: 2px solid var(--hit); color: var(--hit); border-radius: 999px; font-weight: 700; font-size: 20px; transform: rotate(-3deg); }
  .btn {
    margin-top: 16px; width: 100%; font: inherit; font-size: 28px; font-weight: 700; cursor: pointer;
    color: var(--bg); background: var(--ink); border: 2px solid var(--ink); border-radius: 14px; padding: 8px 12px;
  }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn.sub { margin-top: 10px; font-size: 22px; color: var(--ink); background: transparent; }
  .btn:focus-visible, .tb:focus-visible, #pauseBtn:focus-visible, #soundBtn:focus-visible { outline: 3px solid var(--hit); outline-offset: 2px; }
  .hint { word-break: keep-all; font-size: 17px; color: var(--muted); margin-top: 12px; line-height: 1.3; }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
  html[lang="ja"] * { word-break: normal !important; line-break: strict; }
  html:not([lang="ko"]) #soundBtn, html:not([lang="ko"]) #pauseBtn { white-space: nowrap; font-size: 15px; padding: 2px 10px; }
  html:not([lang="ko"]) #hud .sub { font-size: 17px; white-space: nowrap; }
  html:not([lang="ko"]) #tCoins { white-space: nowrap; }
  html:not([lang="ko"]) .tb span { white-space: nowrap; }
</style>

</head>
<body>
<div id="stage">
  <canvas id="cv" data-a="aria-label:canvasLabel"></canvas>
  <div id="hud" class="gutter">
    <div>
      <div class="nums"><span id="tStage"></span></div>
      <div class="sub"><span data-i="scoreL"></span> <span id="tScore">0</span></div>
    </div>
    <div class="right"><span><span data-i="bestL"></span> <span id="tBest">0</span><span data-i="unit"></span></span><div class="btns"><button id="soundBtn" type="button" aria-pressed="true"></button><button id="pauseBtn" type="button" hidden data-i="pause"></button></div></div>
  </div>
  <div id="toast" aria-live="polite"></div>
  <div id="bar" class="gutter">
    <div class="mv">
      <div class="grp">
        <button class="tb" id="mvL" type="button" data-a="aria-label:moveL">◀</button>
        <button class="tb" id="mvR" type="button" data-a="aria-label:moveR">▶</button>
      </div>
      <div id="fuel" data-a="aria-label:fuelLabel"><div id="fuelFill"></div></div>
    </div>
    <div class="gap"></div>
    <div class="grp" id="wpns"></div>
  </div>
  <div id="panel" class="gutter"><div class="card" id="card"></div></div>
</div>

<script>

      start: "バトル開始", retry: "もう一度", resume: "再開", paused: "一時停止中",
      overTitle: "戦車がこわれた！", unit: "点", best: "ベスト", newBest: "新記録！",
      wins: "勝利", dealt: "与ダメージ",
      myTurn: "自分の番", foeTurn: "相手の番", win: "勝利！", wind: "風",
      share: "スコアを共有", shareCopied: "コピーしました", shareFail: "コピーできませんでした",
      shareText: (st, sc) => `キャノンヒルで${st}面まで${sc}点！挑戦してみて`,

      canvasLabel: "キャノンヒル ゲーム画面", sndOn: "音 ON", sndOff: "音 OFF", pause: "一時停止", bestL: "ベスト", scoreL: "スコア",

    es: {

      start: "Iniciar batalla", retry: "Reintentar", resume: "Continuar", paused: "En pausa",

      shareText: (st, sc) => `¡Llegué al nivel ${st} con ${sc} pts en Cannon Hill! Atrévete a jugar`,

      themes: ["Pradera", "Desierto", "Bosque", "Cañón", "Nevado"],
      ranks: [[2, "Apuntar aún es difícil"], [4, "Aprendiendo a leer el viento"], [7, "Un artillero bastante preciso"], [11, "Dueño de la colina"], [Infinity, "Un artillero legendario"]],

      stageLabel: n => "Nivel " + n, moveL: "Mover a la izquierda", moveR: "Mover a la derecha", fuelLabel: "Combustible de movimiento"
    }
  };
  const LANG = (() => { try { const l = new URLSearchParams(location.search).get("lang"); if (l === "ko" || l === "en" || l === "ja" || l === "es") return l; } catch (e) {} return "ko"; })();
  const T = TT[LANG] || TT.ko;
  (function applyStatic() {
    const d = document;
    d.documentElement.lang = LANG;
    d.title = T.title.replace(/\n/g, " ");
    d.querySelectorAll("[data-i]").forEach(el => { const v = T[el.getAttribute("data-i")]; if (typeof v === "string") el.textContent = v; });
    d.querySelectorAll("[data-a]").forEach(el => { const p = el.getAttribute("data-a").split(":"); if (T[p[1]]) el.setAttribute(p[0], T[p[1]]); });
    const s = d.getElementById("tStage"); if (s) s.textContent = T.stageLabel(1);
  })();


  /* ---------- 게임 설정 ---------- */
  const W = 400;                          // 세계 가로(논리 단위). 세로는 화면 비율대로
  const CFG = {
    gravity: 200, vmax: 330, pullMax: 100, minPow: 0.12,
    hp: 100, fuel: 55, moveSpeed: 42, fallFree: 34, fallDmg: 0.4,

  const AMMO = [Infinity, 2, 2];

  const cv = $("cv"), ctx = cv.getContext("2d");
  const card = $("card"), panel = $("panel");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const mod = (v, m) => ((v % m) + m) % m;
  const gauss = () => Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(6.2831853 * Math.random());

  let best = 0;

  function readColors() {
    const s = getComputedStyle(document.documentElement);
    for (const k of COLOR_KEYS) C[k] = s.getPropertyValue("--" + k).trim() || "#888";

    applyTheme();
  }

  const THEMES = [
    { id: "meadow", deco: "tree", hills: "round", cloudA: 0.85, sunR: 22, sunY: 0.17,

  async function shareScore() {

  }
  function startGame() { begin(); if (audioInit()) bgmStart(audioLevel, true); }
  function die() {
    state = "over"; $("pauseBtn").hidden = true; aim.dragging = false; movingDir = 0;
    bgmStop(); sfx("lose");

    paintHud(true); paintBar(true);

  }

  /* ================= 발사 / 폭발 ================= */
  const rad = d => d * Math.PI / 180;
  function pivotOf(t) {
    const sl = slopeOf(t);
    return { x: t.x + 14 * Math.sin(sl), y: t.y - 14 * Math.cos(sl) };
  }
  function slopeOf(t) { return clamp(Math.atan2(gY(t.x + 7) - gY(t.x - 7), 14), -0.7, 0.7); }
  function muzzleOf(t, angDeg) { const p = pivotOf(t), a = rad(angDeg); return { x: p.x + Math.cos(a) * 21, y: p.y - Math.sin(a) * 21 }; }
  function fire(owner, ang, pow, wi) {
    const w = WPN[wi];
    if (owner.ammo[wi] <= 0) return false;
    if (owner.ammo[wi] !== Infinity) owner.ammo[wi]--;
    const v = CFG.vmax * pow;
    for (let i = 0; i < w.count; i++) {
      const off = w.count === 1 ? 0 : (i - (w.count - 1) / 2) * w.spread;
      const a = rad(ang) + off, m = muzzleOf(owner, ang);
      projs.push({ x: m.x, y: m.y, vx: Math.cos(a) * v, vy: -Math.sin(a) * v, w, owner, age: 0, done: false, trail: [], tt: 0 });
    }
    owner.aimAng = ang; owner.recoil = 1;
    sfx("fire"); shake = Math.max(shake, reduceMotion ? 0 : 0.12);
    phase = "fly"; phaseT = 0; timeScale = 1;
    return true;
  }
  function burst(x, y, n, cols, spd) {
    for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, v = rnd(30, spd || 150); parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 50, life: rnd(0.4, 0.9), age: 0, c: cols[(Math.random() * cols.length) | 0], r: rnd(1.8, 3.6) }); }
  }
  function damage(t, d, owner) {
    if (t.dead || d <= 0) return;
    t.hp = Math.max(0, t.hp - d);
    floats.push({ x: t.x, y: t.y - 42, text: "-" + d, age: 0 });
    sfx("hit");
    if (t === enemy && owner === player) { dealt += d; score = wins * 100 + dealt; }
    if (t.hp <= 0) { t.dead = true; t.falling = false; t.vy = 0; burst(t.x, t.y - 8, 40, ["hit", "coin", "ink"], 220); shake = Math.max(shake, reduceMotion ? 0 : 0.5); }
  }
  function explode(x, y, w, owner) {
    crater(x, y, w.r);
    rings.push({ x, y, r: w.blast, age: 0 });
    sfx(w.r >= 40 ? "boomL" : "boomS");
    burst(x, y, Math.round(w.r * 0.7), ["coin", "hit", "dirt"], 40 + w.r * 3);
    shake = Math.max(shake, reduceMotion ? 0 : w.r / 70);
    for (const t of tanks) {
      if (t.dead) continue;
      const d = Math.hypot(x - t.x, y - (t.y - 9));
      if (d < w.blast) damage(t, Math.round(w.dmg * Math.max(0, 1 - Math.max(0, d - 10) / (w.blast - 10))), owner);
    }

  }
  function stepProjectiles(dt) {
    const n = Math.max(1, Math.ceil(dt * 120)), h = dt / n;

      for (const p of projs) {
        if (p.done) continue;
        p.vy += CFG.gravity * h; p.vx += wind * h; p.x += p.vx * h; p.y += p.vy * h; p.age += h; p.tt += h;
        if (p.tt > 0.045) { p.tt = 0; p.trail.push({ x: p.x, y: p.y }); if (p.trail.length > 14) p.trail.shift(); }

  /* ================= 컴퓨터 상대 ================= */
  function simLand(x0, y0, vx, vy, w, tgt) {
    let x = x0, y = y0, ux = vx, uy = vy; const h = 1 / 120;
    for (let i = 0; i < 1440; i++) {
      uy += CFG.gravity * h; ux += w * h; x += ux * h; y += uy * h;
      if (x < -40 || x > W + 40) return { x, out: true };
      if (x >= 0 && x <= W && y >= gY(x)) return { x, y, ground: true };

    }

  }
  function aiPlan() {
    const me = enemy, tg = player, dir = tg.x > me.x ? 1 : -1;
    const cands = [];
    for (let a = 28; a <= 72; a += 2) {
      const ang = dir > 0 ? a : 180 - a;
      const m = muzzleOf(me, ang), ca = Math.cos(rad(ang)), sa = Math.sin(rad(ang));
      const err = p => { const r = simLand(m.x, m.y, ca * CFG.vmax * p, -sa * CFG.vmax * p, wind, tg); return r.hit ? 0 : (r.x - tg.x) * dir; };
      let lo = 0.15, hi = 1;
      if (err(hi) < 0 || err(lo) > 0) continue;
      for (let k = 0; k < 14; k++) { const mid = (lo + hi) / 2; if (err(mid) > 0) hi = mid; else lo = mid; }
      const p = (lo + hi) / 2;
      cands.push({ ang, pow: p, e: Math.abs(err(p)) });
    }
    let pick;
    const good = cands.filter(c => c.e < 8);
    if (good.length) pick = good[(Math.random() * good.length) | 0];
    else pick = cands.length ? cands.sort((a, b) => a.e - b.e)[0] : { ang: dir > 0 ? 50 : 130, pow: 0.8 };
    const dk = clamp(CFG.aiRefGap / Math.max(60, Math.abs(tg.x - me.x)), CFG.aiGapMin, CFG.aiGapMax);   // 가까울수록 오차를 키워 거리와 상관없이 난이도 유지
    const sigP = Math.max(CFG.aiErrMin, CFG.aiErrBase * Math.pow(CFG.aiErrDecay, stage - 1)) * aiErr * dk;

  }

  /* ================= 턴 진행 ================= */

  }
  function resolveTurn() {

  function nextRound() { stage++; newRound(false); toast(T.stageLabel(stage) + " · " + T.themes[mod(stage - 1, T.themes.length)] + " — " + T.myTurn, 1700); }

  /* ================= 입력 ================= */
  const stageEl = $("stage");

  /* 아래 버튼 줄 */
  const wp = $("wpns");

  wp.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b || !canAim()) return;

  };

  const keys = {};
  addEventListener("keydown", e => {

      if (k === "ArrowRight") { e.preventDefault(); aim.ang = clamp(aim.ang - 1, 4, 176); player.aimAng = aim.ang; return; }

  /* ================= 갱신 ================= */
  function tankPhysics(t, dt) {

  /* ---------- HUD / 버튼 ---------- */
  let hudCache = "", barCache = "";

  /* ================= 그리기 ================= */
  function ink(w) { ctx.lineWidth = w; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = C.ink; }
  const CLOUDS = Array.from({ length: 5 }, (_, i) => ({ x: i * 110 + rnd(0, 40), y: rnd(0.06, 0.2), s: rnd(0.8, 1.3) }));
  let cloudShift = 0;
  const hillY = (base, amp, wl, ph, x) => H - base - amp * (0.55 + 0.45 * Math.sin(x / wl + ph));

  const DECO_X = [24, 82, 141, 203, 262, 318, 376];
  function drawDeco(kind, x, y, sc) {
    ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
    ctx.lineWidth = 1.5 / sc; ctx.lineJoin = "round"; ctx.strokeStyle = C.ink; ctx.globalAlpha = 0.55;
    if (kind === "tree") {
      ctx.fillStyle = C.deco2; ctx.fillRect(-2, -13, 4, 14); ctx.strokeRect(-2, -13, 4, 14);
      ctx.fillStyle = C.deco1; ctx.beginPath(); ctx.arc(0, -22, 11, 0, 6.3); ctx.fill(); ctx.stroke();
    } else if (kind === "pine" || kind === "snowpine") {
      ctx.fillStyle = C.deco2; ctx.fillRect(-2, -5, 4, 6);
      for (let k = 0; k < 3; k++) {
        const by = -4 - k * 10, hw = 12 - k * 2.6;
        ctx.fillStyle = C.deco1; ctx.beginPath(); ctx.moveTo(-hw, by); ctx.lineTo(hw, by); ctx.lineTo(0, by - 16); ctx.closePath(); ctx.fill(); ctx.stroke();
        if (kind === "snowpine") { ctx.fillStyle = C.cloud; ctx.beginPath(); ctx.moveTo(-hw * 0.45, by - 9); ctx.lineTo(hw * 0.45, by - 9); ctx.lineTo(0, by - 16); ctx.closePath(); ctx.fill(); }
      }
    } else if (kind === "cactus") {
      ctx.fillStyle = C.deco1;
      ctx.beginPath(); ctx.roundRect(-4, -32, 8, 33, 4); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.roundRect(-12, -22, 9, 4, 2); ctx.roundRect(-13, -28, 4.5, 10, 2); ctx.fill(); ctx.stroke();

    }

  }
  function drawBackground(ts) {
    const th = curTheme;
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, C.sky1); g.addColorStop(0.7, C.sky2); g.addColorStop(1, C.sky2);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = C.sun; ctx.beginPath(); ctx.arc(W - 62, H * th.sunY, th.sunR, 0, 6.3); ctx.fill();

      for (const m of MESAS) { const top = H - 300 - m.h; ctx.beginPath(); ctx.moveTo(m.x - m.w / 2 - 12, H); ctx.lineTo(m.x - m.w / 2, top); ctx.lineTo(m.x + m.w / 2, top); ctx.lineTo(m.x + m.w / 2 + 12, H); ctx.closePath(); ctx.fill(); }
    } else hill(C.hill2, b2[0], b2[1], b2[2], b2[3]);
    if (th.deco !== "none" && th.hills !== "mesa") for (let i = 0; i < DECO_X.length; i++) { if (i % 2) continue; const x = DECO_X[i] + 14; drawDeco(th.deco, x, hillY(b2[0], b2[1], b2[2], b2[3], x) + 2, 0.7); }
    hill(C.hill1, b1[0], b1[1], b1[2], b1[3]);
    if (th.deco !== "none") for (let i = 0; i < DECO_X.length; i++) { const x = DECO_X[i]; drawDeco(th.deco, x, hillY(b1[0], b1[1], b1[2], b1[3], x) + 2, 0.95 + (i % 3) * 0.12); }
    if (th.snow) {                                                         // 눈송이
      ctx.fillStyle = C.cloud; ctx.globalAlpha = 0.9;
      for (let i = 0; i < 36; i++) {
        const x = mod(i * 37.7 + Math.sin(ts * 0.8 + i) * 10 + cloudShift * 0.5, W), y = mod(i * 53.3 + ts * (16 + (i % 5) * 7), H);
        ctx.beginPath(); ctx.arc(x, y, 1.2 + (i % 3) * 0.5, 0, 6.3); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }
  function drawTerrain() {
    ctx.beginPath(); ctx.moveTo(0, H + 6);
    for (let x = 0; x <= W; x++) ctx.lineTo(x, H - hh[x]);
    ctx.lineTo(W, H + 6); ctx.closePath();
    ctx.fillStyle = C.dirt; ctx.fill();
    ctx.beginPath(); for (let x = 0; x <= W; x++) { const y = H - hh[x]; if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
    ctx.lineWidth = 7; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = C.grass; ctx.stroke();
    ink(2.2); ctx.stroke();
    ink(1.4); ctx.globalAlpha = 0.28; ctx.beginPath();                      // 흙 질감 점선
    for (let x = 10; x < W; x += 34) { const y = H - hh[x] + 20 + ((x * 7) % 30); ctx.moveTo(x, y); ctx.lineTo(x + 8, y); }
    ctx.stroke(); ctx.globalAlpha = 1;
  }
  function drawTank(t, ts) {
    if (t.dead) return;
    const sl = slopeOf(t);
    ctx.save(); ctx.translate(t.x, t.y); ctx.rotate(sl);
    ink(2.2); ctx.fillStyle = C.ink;
    ctx.beginPath(); ctx.roundRect(-16, -7, 32, 8, 4); ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.bg; for (const wx of [-10, 0, 10]) { ctx.beginPath(); ctx.arc(wx, -3, 2.6, 0, 6.3); ctx.fill(); }
    ctx.fillStyle = C[t.color]; ink(2.2);
    ctx.beginPath(); ctx.roundRect(-13, -15, 26, 9, 4); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -15, 7.5, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();
    const pv = pivotOf(t), a = rad(t.aimAng), L = 21 - t.recoil * 5;
    const ex = pv.x + Math.cos(a) * L, ey = pv.y - Math.sin(a) * L;
    ink(8); ctx.beginPath(); ctx.moveTo(pv.x, pv.y); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.strokeStyle = C[t.color]; ctx.lineWidth = 4.2; ctx.stroke();
    ctx.fillStyle = C[t.color]; ink(2); ctx.beginPath(); ctx.arc(pv.x, pv.y, 4.5, 0, 6.3); ctx.fill(); ctx.stroke();
    // 체력
    const bw = 38, bx = t.x - bw / 2, by = t.y - 36;
    ctx.fillStyle = C.bg; ctx.fillRect(bx, by, bw, 6);
    const r = t.hp / t.hpMax; ctx.fillStyle = r > 0.5 ? C.hpOk : r > 0.25 ? C.coin : C.hit; ctx.fillRect(bx, by, bw * r, 6);
    ink(1.6); ctx.strokeRect(bx, by, bw, 6);
    ctx.fillStyle = C.ink; ctx.font = '700 13px "Gaegu","Apple SD Gothic Neo","Noto Sans KR","Hiragino Sans","Yu Gothic","Meiryo",sans-serif'; ctx.textAlign = "center";
    ctx.fillText(Math.ceil(t.hp), t.x, by - 3);
    if (state === "play" && phase !== "banner" && ((turn === "player" && t === player) || (turn === "enemy" && t === enemy)) && (phase === "aim" || phase === "ai")) {
      const bob = Math.sin(ts * 6) * 2;
      ctx.fillStyle = C.hit; ink(1.6); ctx.beginPath(); ctx.moveTo(t.x - 5, by - 24 + bob); ctx.lineTo(t.x + 5, by - 24 + bob); ctx.lineTo(t.x, by - 16 + bob); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  }
  function drawAimGuide() {
    if (!(canAim() || aim.dragging)) return;
    const m = muzzleOf(player, aim.ang), a = rad(aim.ang), v = CFG.vmax * aim.pow;
    // 짧은 예상 궤적(바람 제외, 앞부분만)
    ctx.fillStyle = C.ink; ctx.globalAlpha = 0.7;
    for (let i = 1; i <= 7; i++) {
      const t = i * 0.06, x = m.x + Math.cos(a) * v * t, y = m.y - Math.sin(a) * v * t + 0.5 * CFG.gravity * t * t;
      ctx.beginPath(); ctx.arc(x, y, 2.4 - i * 0.12, 0, 6.3); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // 파워 막대
    const bx = player.x - 24, by = player.y - 62;
    ctx.fillStyle = C.bg; ctx.fillRect(bx, by, 48, 7);
    ctx.fillStyle = aim.pow > 0.85 ? C.hit : C.coin; ctx.fillRect(bx, by, 48 * aim.pow, 7);
    ink(1.6); ctx.strokeRect(bx, by, 48, 7);
    const da = aim.ang <= 90 ? aim.ang : 180 - aim.ang;
    ctx.fillStyle = C.ink; ctx.font = '700 14px "Gaegu","Apple SD Gothic Neo","Noto Sans KR","Hiragino Sans","Yu Gothic","Meiryo",sans-serif'; ctx.textAlign = "center";
    ctx.fillText(Math.round(da) + "° · " + Math.round(aim.pow * 100) + "%", player.x, by - 4);
  }
  function drawWind() {
    const y = 88, cx = W / 2;
    ctx.font = '700 15px "Gaegu","Apple SD Gothic Neo","Noto Sans KR","Hiragino Sans","Yu Gothic","Meiryo",sans-serif'; ctx.textAlign = "center";
    ctx.fillStyle = C.ink; ctx.fillText(T.wind + " " + Math.abs(wind), cx, y);
    if (!wind) return;
    const len = 12 + Math.abs(wind) * 1.5, dir = Math.sign(wind);
    ink(3); ctx.beginPath(); ctx.moveTo(cx - dir * len / 2, y + 9); ctx.lineTo(cx + dir * len / 2, y + 9);
    ctx.moveTo(cx + dir * len / 2, y + 9); ctx.lineTo(cx + dir * (len / 2 - 6), y + 4); ctx.moveTo(cx + dir * len / 2, y + 9); ctx.lineTo(cx + dir * (len / 2 - 6), y + 14); ctx.stroke();
  }
  function render(ts) {
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 14, (Math.random() - 0.5) * shake * 14);
    drawBackground(ts); drawTerrain();
    if (lastImpact && state === "play") {                                  // 내 지난 탄착점 표시
      ink(2); ctx.globalAlpha = 0.5; ctx.beginPath(); ctx.moveTo(lastImpact.x - 5, lastImpact.y - 5); ctx.lineTo(lastImpact.x + 5, lastImpact.y + 5); ctx.moveTo(lastImpact.x + 5, lastImpact.y - 5); ctx.lineTo(lastImpact.x - 5, lastImpact.y + 5); ctx.stroke(); ctx.globalAlpha = 1;
    }
    drawTank(enemy, ts); drawTank(player, ts);
    for (const p of projs) {
      for (let i = 0; i < p.trail.length; i++) { ctx.globalAlpha = (i + 1) / p.trail.length * 0.5; ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(p.trail[i].x, p.trail[i].y, 1.8, 0, 6.3); ctx.fill(); }
      ctx.globalAlpha = 1; ctx.fillStyle = C.ink; ctx.beginPath(); ctx.arc(p.x, p.y, 4.2, 0, 6.3); ctx.fill();
      ctx.fillStyle = C.coin; ctx.beginPath(); ctx.arc(p.x - 1, p.y - 1, 1.6, 0, 6.3); ctx.fill();
      if (p.y < 8) { ink(2); ctx.beginPath(); ctx.moveTo(p.x, 6); ctx.lineTo(p.x - 5, 14); ctx.moveTo(p.x, 6); ctx.lineTo(p.x + 5, 14); ctx.stroke(); }    // 화면 위로 나간 포탄 표시
    }
    for (const q of parts) { ctx.globalAlpha = Math.max(0, 1 - q.age / q.life); ctx.fillStyle = C[q.c] || C.coin; ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, 6.3); ctx.fill(); }
    ctx.globalAlpha = 1;
    for (const r of rings) { const k = r.age / 0.35; ctx.globalAlpha = 1 - k; ink(3); ctx.strokeStyle = C.coin; ctx.beginPath(); ctx.arc(r.x, r.y, r.r * (0.3 + 0.7 * k), 0, 6.3); ctx.stroke(); }
    ctx.globalAlpha = 1;
    drawAimGuide(); drawWind();
    ctx.font = '700 20px "Gaegu","Apple SD Gothic Neo","Noto Sans KR","Hiragino Sans","Yu Gothic","Meiryo",sans-serif'; ctx.textAlign = "center";
    for (const f of floats) { ctx.globalAlpha = Math.max(0, 1 - f.age / 1.2); ctx.fillStyle = C.hit; ctx.fillText(f.text, f.x, f.y - f.age * 26); }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  /* ================= 메인 루프 ================= */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000 || 0.016); last = now;
    cloudShift += wind * 0.35 * dt;
    if (state !== "pause") update(dt);
    render(now / 1000);
    requestAnimationFrame(frame);
  }

  /* ---------- 시작 ---------- */
  readColors(); resize(); newRound(true); state = "ready"; paintSound(); showReady();
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
