<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>오픈 런</title>
<style>
  @font-face { font-family: "Gaegu"; font-style: normal; font-weight: 400; font-display: swap; src: url("/games/fonts/gaegu-400.woff2") format("woff2"); }
  @font-face { font-family: "Gaegu"; font-style: normal; font-weight: 700; font-display: swap; src: url("/games/fonts/gaegu-700.woff2") format("woff2"); }
</style>
<style>
  /* Layout concept: a doodled side-scroller on paper. Ink outlines on everything, soft sky behind, the runner stays near the left third of the screen. */
  :root {
    --bg: #fdfdfb; --ink: #1c2331; --muted: #6a7282; --hit: #e5484d;
    --sky1: #bfe3ff; --sky2: #f4fbff; --hill1: #d3ebda; --hill2: #b9dec6; --cloud: #ffffff;
    --grass: #7ecb6b; --dirt: #d9b98c; --wood: #e0b070; --coin: #ffd23f; --mob: #9b7bd6;
    --skin: #f6d2b0; --cap: #2bb3a8; --shirt: #f4b73f; --scarf: #ff7a45; --heart: #ff5d8f; --sun: #ffe08a; --pit: #4a5a7e;
    --font-hand: "Gaegu", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171f; --ink: #e8ebf2; --muted: #98a1b3; --hit: #ff6b70;
      --sky1: #0d1530; --sky2: #1c2b55; --hill1: #1d3a40; --hill2: #17303a; --cloud: #8a96c0;
      --grass: #3f8f4f; --dirt: #6b5236; --wood: #8a6a3a; --coin: #ffcf3a; --mob: #7a5fc0;
      --skin: #e8c3a0; --cap: #1f948b; --shirt: #d99a2a; --scarf: #ff8a58; --heart: #ff6b9c; --sun: #dfe6ff; --pit: #05080f;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171f; --ink: #e8ebf2; --muted: #98a1b3; --hit: #ff6b70;
    --sky1: #0d1530; --sky2: #1c2b55; --hill1: #1d3a40; --hill2: #17303a; --cloud: #8a96c0;
    --grass: #3f8f4f; --dirt: #6b5236; --wood: #8a6a3a; --coin: #ffcf3a; --mob: #7a5fc0;
    --skin: #e8c3a0; --cap: #1f948b; --shirt: #d99a2a; --scarf: #ff8a58; --heart: #ff6b9c; --sun: #dfe6ff; --pit: #05080f;
    color-scheme: dark;
  }

  html, body { height: 100%; }
  html { overscroll-behavior: none; }
  body {
    margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: var(--font-hand); overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: relative; width: 100%; max-width: 480px; height: 100%;
    margin: 0 auto; touch-action: none; overflow: hidden; background: var(--sky2);
    border-left: 1px solid color-mix(in srgb, var(--ink) 12%, transparent);
    border-right: 1px solid color-mix(in srgb, var(--ink) 12%, transparent);
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  #hud {
    position: absolute; inset: 0 0 auto 0; display: flex; justify-content: space-between; align-items: flex-start;
    padding-top: 12px; pointer-events: none; font-weight: 700; line-height: 1.05; z-index: 3; color: var(--hudInk, var(--ink));
  }
  #hud .nums { font-size: 32px; font-variant-numeric: tabular-nums; text-shadow: 0 0 6px var(--hudSh, var(--sky2)), 0 0 2px var(--hudSh, var(--sky2)); }
  #hud .nums small { font-size: 17px; font-weight: 400; color: var(--hudInk, var(--ink)); margin-left: 6px; opacity: .75; }
  #hud .sub { font-size: 22px; font-weight: 400; display: flex; align-items: center; gap: 10px; margin-top: 2px; text-shadow: 0 0 6px var(--hudSh, var(--sky2)), 0 0 2px var(--hudSh, var(--sky2)); }
  #tHearts { color: var(--heart); letter-spacing: 2px; font-size: 26px; }
  #tHearts .off { color: var(--muted); opacity: .6; }
  #hud .right { text-align: right; font-size: 18px; color: var(--hudInk, var(--ink)); font-weight: 400; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; text-shadow: 0 0 6px var(--hudSh, var(--sky2)); }
  #hud .btns { display: flex; gap: 8px; }
  #pauseBtn, #soundBtn {
    pointer-events: auto; font: inherit; font-size: 18px; color: var(--ink); background: color-mix(in srgb, var(--bg) 70%, transparent);
    border: 2px solid var(--ink); border-radius: 999px; padding: 2px 14px; cursor: pointer;
  }
  #soundBtn[aria-pressed="false"] { color: var(--muted); border-color: var(--muted); }
  #toast {
    position: absolute; left: 0; right: 0; top: 24%; text-align: center; pointer-events: none; z-index: 3;
    font-size: 34px; padding: 0 12px; word-break: keep-all; font-weight: 700; color: var(--hit); opacity: 0; transform: scale(.9);
    transition: opacity .25s, transform .25s; text-shadow: 0 0 6px var(--bg), 0 0 3px var(--bg);
  }
  #toast.show { opacity: 1; transform: scale(1); }

  #panel {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 2; pointer-events: none;
    background: color-mix(in srgb, var(--bg) 45%, transparent);
  }
  #panel[hidden] { display: none; }
  .card {
    width: min(100%, 340px); box-sizing: border-box; text-align: center; pointer-events: auto;
    background: var(--bg); border: 2px solid var(--ink); border-radius: 18px;
    box-shadow: 5px 5px 0 var(--ink); padding: 22px 20px 20px;
  }
  .card h1 { margin: 0 0 6px; font-size: 38px; line-height: 1.05; text-wrap: balance; }
  .card p { word-break: keep-all; margin: 6px 0; font-size: 20px; line-height: 1.3; color: var(--muted); text-wrap: balance; }
  .card .big { font-size: 46px; font-weight: 700; color: var(--ink); line-height: 1; margin: 10px 0 4px; font-variant-numeric: tabular-nums; }
  .card .row { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 18px; font-size: 20px; color: var(--ink); margin: 6px 0 2px; }
  .card .badge { display: inline-block; margin-top: 4px; padding: 0 12px; border: 2px solid var(--hit); color: var(--hit); border-radius: 999px; font-weight: 700; font-size: 20px; transform: rotate(-3deg); }
  .btn {
    margin-top: 16px; width: 100%; font: inherit; font-size: 28px; font-weight: 700; cursor: pointer;
    color: var(--bg); background: var(--ink); border: 2px solid var(--ink); border-radius: 14px; padding: 8px 12px;
  }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn.sub { margin-top: 10px; font-size: 22px; color: var(--ink); background: transparent; }
  .btn:focus-visible, #pauseBtn:focus-visible, #soundBtn:focus-visible { outline: 3px solid var(--hit); outline-offset: 2px; }
  .hint { word-break: keep-all; font-size: 17px; color: var(--muted); margin-top: 12px; line-height: 1.3; }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
  html[lang="ja"] * { word-break: normal !important; line-break: strict; }
  html:not([lang="ko"]) #soundBtn, html:not([lang="ko"]) #pauseBtn { white-space: nowrap; font-size: 15px; padding: 2px 10px; }
  html:not([lang="ko"]) #hud .sub { font-size: 17px; white-space: nowrap; }
  html:not([lang="ko"]) #tCoins { white-space: nowrap; }
</style>

</head>
<body>
<div id="stage">
  <canvas id="cv" data-a="aria-label:canvasLabel"></canvas>
  <div id="hud" class="gutter">
    <div>
      <div class="nums"><span id="tScore">0</span><small data-i="unit"></small></div>
      <div class="sub"><span id="tHearts" data-a="aria-label:heartsLabel"></span><span id="tCoins"></span></div>
    </div>
    <div class="right"><span><span data-i="bestL"></span> <span id="tBest">0</span><span data-i="unit"></span></span><div class="btns"><button id="soundBtn" type="button" aria-pressed="true"></button><button id="pauseBtn" type="button" hidden data-i="pause"></button></div></div>
  </div>
  <div id="toast" aria-live="polite"></div>
  <div id="panel" class="gutter"><div class="card" id="card"></div></div>
</div>

<script>
(() => {
  "use strict";

  /* ---------- 문구: 나중에 다국어(ko/en/ja/es)로 확장하기 쉽게 한곳에 모음 ---------- */
  const TT = {
    ko: {
    title: "오픈 런",
    readyDesc: "알아서 달려요. 화면을 누르면 점프, 한 번 더 누르면 2단 점프!",
    readyHint: "높은 발판은 2단 점프로 올라가요\n날아다니는 몹은 밟으면 보너스!\n가시 몹은 밟지 말고 넘어가세요\n놓친 몹은 나중에 다시 나타나요\nPC는 스페이스 키",
    start: "달리기 시작", retry: "다시 달리기", resume: "계속하기", paused: "잠깐 멈춤",
    overTitle: "쓰러졌어요!", unit: "점",
    distance: "거리", coins: "코인", stomps: "밟은 몹", best: "최고", newBest: "새 기록!",
    speedUp: "속도 업!", share: "점수 공유", shareCopied: "문구를 복사했어요", shareFail: "복사하지 못했어요",
    shareText: (sc, m) => `오픈 런에서 ${sc}점! (${m}m 달렸어요) 도전해 보세요`, jumpHint: "점프! 한 번 더 2단!", heal: "하트 회복!",
    ranks: [[30, "이제 막 걷기 시작했어요"], [80, "달리는 맛이 나요"], [160, "꽤 잘 달리네요"], [300, "모험가 소질이 있어요"], [Infinity, "전설의 달리기 선수예요"]],
      canvasLabel: "오픈 런 게임 화면", heartsLabel: "하트", sndOn: "소리 켜짐", sndOff: "소리 꺼짐", pause: "멈춤", bestL: "최고"
    },
    en: {
      title: "Open Run",
      readyDesc: "It runs by itself. Tap to jump, tap again to double jump!",
      readyHint: "Double jump to reach high platforms\nStomp flying monsters for a bonus!\nDon't stomp spiky ones, jump over them\nMissed monsters come back later\nOn PC press Space",
      start: "Start running", retry: "Run again", resume: "Resume", paused: "Paused",
      overTitle: "You fell!", unit: " pts",
      distance: "Distance", coins: "Coins", stomps: "Stomps", best: "Best", newBest: "New record!",
      speedUp: "Speed up!", share: "Share score", shareCopied: "Copied to clipboard", shareFail: "Couldn't copy",
      shareText: (sc, m) => `I scored ${sc} pts in Open Run! (ran ${m} m) Give it a try`, jumpHint: "Jump! Tap again for a double jump!", heal: "Heart restored!",
      ranks: [[30, "Just started walking"], [80, "Getting into the run"], [160, "Running pretty well"], [300, "You have adventurer talent"], [Infinity, "A legendary runner"]],
      canvasLabel: "Open Run game screen", heartsLabel: "Hearts", sndOn: "Sound on", sndOff: "Sound off", pause: "Pause", bestL: "Best"
    },
    ja: {
      title: "オープンラン",
      readyDesc: "自動で走るよ。タップでジャンプ、もう一度タップで2段ジャンプ！",
      readyHint: "高い足場は2段ジャンプで登れる\n飛んでいるモンスターは踏むとボーナス！\nトゲのモンスターは踏まずに飛び越えよう\n逃したモンスターは後でまた現れる\nPCはスペースキー",
      start: "走り出す", retry: "もう一回走る", resume: "再開", paused: "一時停止中",
      overTitle: "倒れちゃった！", unit: "点",
      distance: "距離", coins: "コイン", stomps: "踏んだ数", best: "ベスト", newBest: "新記録！",
      speedUp: "スピードアップ！", share: "スコアを共有", shareCopied: "コピーしました", shareFail: "コピーできませんでした",
      shareText: (sc, m) => `オープンランで${sc}点！（${m}m走った）挑戦してみて`, jumpHint: "ジャンプ！もう一度で2段！", heal: "ハート回復！",
      ranks: [[30, "歩き始めたばかり"], [80, "走る楽しさが出てきた"], [160, "なかなかいい走り"], [300, "冒険家の素質あり"], [Infinity, "伝説のランナー"]],
      canvasLabel: "オープンラン ゲーム画面", heartsLabel: "ハート", sndOn: "音 ON", sndOff: "音 OFF", pause: "一時停止", bestL: "ベスト"
    },
    es: {
      title: "Open Run",
      readyDesc: "Corre solo. Toca para saltar y toca otra vez para un doble salto.",
      readyHint: "Con el doble salto subes a plataformas altas\n¡Pisa a los monstruos voladores para un bonus!\nNo pises a los de pinchos, sáltalos\nLos que se escapan vuelven más tarde\nEn PC pulsa Espacio",
      start: "Empezar a correr", retry: "Correr otra vez", resume: "Continuar", paused: "En pausa",
      overTitle: "¡Te caíste!", unit: " pts",
      distance: "Distancia", coins: "Monedas", stomps: "Pisotones", best: "Récord", newBest: "¡Nuevo récord!",
      speedUp: "¡Más rápido!", share: "Compartir puntos", shareCopied: "Texto copiado", shareFail: "No se pudo copiar",
      shareText: (sc, m) => `¡${sc} pts en Open Run! (${m} m corridos) Atrévete a jugar`, jumpHint: "¡Salta! ¡Otra vez para doble salto!", heal: "¡Corazón recuperado!",
      ranks: [[30, "Apenas empiezas a caminar"], [80, "Le vas tomando el gusto"], [160, "Corres bastante bien"], [300, "Tienes madera de aventurero"], [Infinity, "Un corredor legendario"]],
      canvasLabel: "Pantalla del juego Open Run", heartsLabel: "Corazones", sndOn: "Sonido sí", sndOff: "Sonido no", pause: "Pausa", bestL: "Récord"
    }
  };
  const LANG = (() => { try { const l = new URLSearchParams(location.search).get("lang"); if (l === "ko" || l === "en" || l === "ja" || l === "es") return l; } catch (e) {} return "ko"; })();
  const T = TT[LANG] || TT.ko;
  (function applyStatic() {
    const d = document;
    d.documentElement.lang = LANG;
    d.title = T.title.replace(/\n/g, " ");
    d.querySelectorAll("[data-i]").forEach(el => { const v = T[el.getAttribute("data-i")]; if (typeof v === "string") el.textContent = v; });
    d.querySelectorAll("[data-a]").forEach(el => { const p = el.getAttribute("data-a").split(":"); if (T[p[1]]) el.setAttribute(p[0], T[p[1]]); });
    const c = d.getElementById("tCoins"); if (c) c.textContent = T.coins + " 0";
  })();


  /* ---------- 게임 설정 ---------- */
  const TILE = 32, VW = 352;              // 한 칸 크기, 화면 가로(논리 단위)
  const CFG = {
    gravity: 2200, jumpV: 700, maxFall: 900, coyote: 0.09, buffer: 0.12, jumpV2: 700, airIgnore: 0.08, stompBounce: 460,
    speedStart: 150, speedRamp: 1.8, speedMax: 300,           // 달리는 속도(단위/초)와 증가량
    levelAt: [20, 40, 70],                                    // 배경음악 단계가 오르는 시간(초)
    maxHearts: 3, invulTime: 1.4,
    mobSpeed: 26, respawnMin: 3, respawnMax: 6, respawnCap: 4, aheadMobCap: 5,
    heartEvery: 28, flyBonus: 20,
    spikeFrom: 18, flyFrom: 25, highFrom: 12                   // 새 요소가 나오기 시작하는 시간(초)
  };

  const $ = id => document.getElementById(id);
  const cv = $("cv"), ctx = cv.getContext("2d");
  const card = $("card"), panel = $("panel");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const mod = (v, m) => ((v % m) + m) % m;

  /* ---------- 저장 ---------- */
  const KEY = "kid-runner-best";
  let best = 0;
  try { best = parseInt(localStorage.getItem(KEY), 10) || 0; } catch (e) {}
  const saveBest = () => { try { localStorage.setItem(KEY, String(best)); } catch (e) {} };

  /* ---------- 색상(CSS 토큰에서 읽어 라이트/다크 대응) ---------- */
  const C = {};
  const COLOR_KEYS = ["ink", "bg", "hit", "sky1", "sky2", "hill1", "hill2", "cloud", "grass", "dirt", "wood", "coin", "mob", "skin", "cap", "shirt", "scarf", "heart", "sun", "pit"];
  function readColors() {
    const s = getComputedStyle(document.documentElement);
    for (const k of COLOR_KEYS) C[k] = s.getPropertyValue("--" + k).trim() || "#888";
    todOK = /^#[0-9a-f]{3,6}$/i.test(C.sky2);
    if (todOK) darkTheme = lumA(hex2(C.sky2)) < 0.4;
  }
  /* ---------- 시간대(낮 → 노을 → 밤) ---------- */
  const TOD_KEYS = ["sky1", "sky2", "hill1", "hill2", "cloud", "sun", "grass", "dirt", "ink", "pit"];
  const PAL = {
    day:   { sky1: "#bfe3ff", sky2: "#f4fbff", hill1: "#d3ebda", hill2: "#b9dec6", cloud: "#ffffff", sun: "#ffe08a", grass: "#7ecb6b", dirt: "#d9b98c", ink: "#1c2331", pit: "#4a5a7e" },
    dusk:  { sky1: "#6c5fc7", sky2: "#ffb48a", hill1: "#a9809a", hill2: "#8d6a8c", cloud: "#ffd3b8", sun: "#ff7d4d", grass: "#6aa35a", dirt: "#a98660", ink: "#2a2236", pit: "#3a2f4f" },
    night: { sky1: "#0d1530", sky2: "#1c2b55", hill1: "#1d3a40", hill2: "#17303a", cloud: "#8a96c0", sun: "#dfe6ff", grass: "#3f8f4f", dirt: "#6b5236", ink: "#e8ebf2", pit: "#05080f" }
  };
  const TOD_PERIOD = 150;                                   // 낮 → 노을 → 밤 → 노을 → 낮 이 150초마다 반복
  const TOD_KF = [[0, "day"], [30, "day"], [50, "dusk"], [60, "dusk"], [80, "night"], [115, "night"], [135, "dusk"], [142, "dusk"], [150, "day"]];
  const hex2 = h => { h = h.replace("#", ""); if (h.length === 3) h = h.split("").map(c => c + c).join(""); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  const mixA = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
  const lumA = a => (0.299 * a[0] + 0.587 * a[1] + 0.114 * a[2]) / 255;
  const palRGB = {};
  for (const n of ["day", "dusk", "night"]) { palRGB[n] = {}; for (const k of TOD_KEYS) palRGB[n][k] = hex2(PAL[n][k]); }
  palRGB.duskDark = {}; for (const k of TOD_KEYS) palRGB.duskDark[k] = mixA(palRGB.dusk[k], palRGB.night[k], 0.55);
  let darkTheme = false, todOK = true;
  const tod = { drop: 0, night: 0 };                       // 해 높이 변화, 별 밝기
  function palFor(name) {
    if (!darkTheme) return palRGB[name];
    return name === "dusk" ? palRGB.duskDark : palRGB.night;
  }
  const metaFor = name => name === "dusk" ? (darkTheme ? [0.6, 0.9] : [1, 0.45]) : name === "night" ? [0, 1] : (darkTheme ? [0, 1] : [0, 0]);
  let hudTone = "";
  function applyTime(tt) {
    if (!todOK) return;
    const x = mod(tt, TOD_PERIOD);
    let i = 0; while (i < TOD_KF.length - 2 && x >= TOD_KF[i + 1][0]) i++;
    const a = TOD_KF[i], b = TOD_KF[i + 1], k = Math.max(0, Math.min(1, (x - a[0]) / (b[0] - a[0])));
    const pa = palFor(a[1]), pb = palFor(b[1]);
    for (const key of TOD_KEYS) { const c = mixA(pa[key], pb[key], k); C[key] = "rgb(" + Math.round(c[0]) + "," + Math.round(c[1]) + "," + Math.round(c[2]) + ")"; }
    const ma = metaFor(a[1]), mb = metaFor(b[1]);
    tod.drop = ma[0] + (mb[0] - ma[0]) * k; tod.night = ma[1] + (mb[1] - ma[1]) * k;
    const top = mixA(mixA(pa.sky1, pb.sky1, k), mixA(pa.sky2, pb.sky2, k), 0.25);
    const tone = lumA(top) < 0.5 ? "light" : "dark";
    if (tone !== hudTone) {
      hudTone = tone; const hud = $("hud");
      if (tone === "light") { hud.style.setProperty("--hudInk", "#eef1f8"); hud.style.setProperty("--hudSh", "#0d1530"); }
      else { hud.style.removeProperty("--hudInk"); hud.style.removeProperty("--hudSh"); }
    }
  }
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readColors);
  new MutationObserver(readColors).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  /* ================= 소리: 합성(음원 파일 없음) ================= */
  const midi = m => 440 * Math.pow(2, (m - 69) / 12);

  /* ================= 소리 합성 (어떤 AudioContext에서도 동작: 실시간/오프라인 검증 겸용) ================= */
  const noiseCache = new WeakMap();
  function noiseBuf(ac) {
    let b = noiseCache.get(ac);
    if (!b) {
      b = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = b.getChannelData(0);

    ctx.beginPath(); ctx.roundRect(-7, -25, 14, 15, 5); ctx.fill(); ctx.stroke();
    // 팔
    ink(3); ctx.beginPath(); ctx.moveTo(2, -21); ctx.lineTo(air ? 11 : 7 + Math.sin(run + 3) * 4, air ? -27 : -14 + Math.cos(run + 3) * 2); ctx.stroke();
    // 머리 + 모자
    ctx.fillStyle = C.skin; ink(2.2); ctx.beginPath(); ctx.arc(1, -32, 8, 0, 6.3); ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.cap; ctx.beginPath(); ctx.arc(1, -33, 8.6, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.roundRect(5, -34, 9, 3.4, 1.6); ctx.fill(); ctx.stroke();
    ctx.fillStyle = C.ink; ctx.beginPath(); if (dead) { ink(1.6); ctx.moveTo(3, -32); ctx.lineTo(6, -29); ctx.moveTo(6, -32); ctx.lineTo(3, -29); ctx.stroke(); } else { ctx.arc(5, -30, 1.4, 0, 6.3); ctx.fill(); }
    ctx.restore();
  }
  function render(ts) {
    applyTime(t);
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 16, (Math.random() - 0.5) * shake * 16);
    drawBackground(); drawGround();
    for (const c of coinsArr) if (!c.got) drawCoin(c, ts);
    for (const it of items) if (!it.got) drawItem(it, ts);
    for (const m of mobs) drawMob(m, ts);
    drawPlayer(ts);
    for (const q of parts) {
      ctx.globalAlpha = Math.max(0, 1 - q.age / q.life);
      ctx.fillStyle = q.c === "hit" ? C.hit : C[q.c] || C.coin;
      ctx.beginPath(); ctx.arc(q.x - camX, gy + q.y, 3.2, 0, 6.3); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  /* ================= 메인 루프 ================= */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000 || 0.016); last = now;
    if (state !== "pause") update(dt);
    render(now / 1000);
    requestAnimationFrame(frame);
  }

  /* ---------- 시작 ---------- */
  readColors(); resize(); resetWorld(); paintSound(); showReady();
  requestAnimationFrame(frame);
})();
</script>
