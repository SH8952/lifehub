<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>크레이지 아케이드</title>
<style>
  @font-face { font-family: "Gaegu"; font-style: normal; font-weight: 400; font-display: swap; src: url("/games/fonts/gaegu-400.woff2") format("woff2"); }
  @font-face { font-family: "Gaegu"; font-style: normal; font-weight: 700; font-display: swap; src: url("/games/fonts/gaegu-700.woff2") format("woff2"); }
</style>
<style>
  /* Layout concept: a doodled arena. Themed backdrop + ink-outlined board in the middle, HUD on top, joystick and balloon button at the bottom. */
  :root {
    --bg: #fdfdfb; --ink: #1c2331; --muted: #6a7282; --hit: #e5484d; --ok: #3fae5a; --mid: #f2a516; --water: #2b7de0;
    --font-hand: "Gaegu", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171f; --ink: #e8ebf2; --muted: #98a1b3; --hit: #ff6b70; --ok: #4cc26a; --mid: #ffc247; --water: #5aa2ff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171f; --ink: #e8ebf2; --muted: #98a1b3; --hit: #ff6b70; --ok: #4cc26a; --mid: #ffc247; --water: #5aa2ff;
    color-scheme: dark;
  }

  html, body { height: 100%; }
  html { overscroll-behavior: none; }
  body {
    margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: var(--font-hand); overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: relative; width: 100%; max-width: 480px; height: 100%;
    margin: 0 auto; touch-action: none; overflow: hidden; background: var(--bg);
    border-left: 1px solid color-mix(in srgb, var(--ink) 12%, transparent);
    border-right: 1px solid color-mix(in srgb, var(--ink) 12%, transparent);
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  #top { position: absolute; inset: 0 0 auto 0; z-index: 3; pointer-events: none; }
  #hud { display: flex; justify-content: space-between; align-items: flex-start; padding-top: 10px; font-weight: 700; line-height: 1.05; }
  #hud .nums { font-size: 30px; font-variant-numeric: tabular-nums; }
  #hud .sub { font-size: 20px; font-weight: 400; margin-top: 2px; }
  #hud .right { text-align: right; font-size: 18px; font-weight: 400; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  #hud .btns { display: flex; gap: 8px; }
  #pauseBtn, #soundBtn {
    pointer-events: auto; font: inherit; font-size: 18px; color: var(--ink); background: color-mix(in srgb, var(--bg) 70%, transparent);
    border: 2px solid var(--ink); border-radius: 999px; padding: 2px 14px; cursor: pointer;
  }
  #soundBtn[aria-pressed="false"] { color: var(--muted); border-color: var(--muted); }
  #timerWrap { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  #timer { flex: 1; height: 14px; border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; background: color-mix(in srgb, var(--bg) 60%, transparent); }
  #timerFill { height: 100%; width: 100%; background: var(--ok); border-radius: 999px; transition: background .2s; }
  #timerFill.mid { background: var(--mid); }
  #timerFill.low { background: var(--hit); }
  #timerNum { min-width: 56px; text-align: right; font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #timerWrap.hot #timer { animation: hotPulse .5s ease-in-out infinite alternate; }
  #timerWrap.hot #timerNum { color: var(--hit); }
  @keyframes hotPulse { from { transform: scaleY(1); } to { transform: scaleY(1.35); } }

  #toast {
    position: absolute; left: 0; right: 0; top: 24%; text-align: center; pointer-events: none; z-index: 4;
    font-size: 32px; padding: 0 12px; word-break: keep-all; font-weight: 700; color: var(--ink); opacity: 0; transform: scale(.9);
    transition: opacity .25s, transform .25s; text-shadow: 0 3px 0 var(--hit), 0 0 8px var(--bg), 0 0 3px var(--bg);
  }
  #toast.show { opacity: 1; transform: scale(1); }

  #stats {
    position: absolute; left: 0; right: 0; z-index: 1; bottom: var(--ctl-h, 150px); display: flex; gap: 6px; align-items: center;
    padding-top: 4px; padding-bottom: 4px; font-size: 16px; line-height: 1; white-space: nowrap;
    background: color-mix(in srgb, var(--bg) 82%, transparent); border-top: 2px solid var(--ink);
  }
  #stats .chips { display: flex; gap: 5px; flex-wrap: nowrap; flex: 1; min-width: 0; overflow: hidden; }
  .chip { display: inline-flex; align-items: center; gap: 3px; padding: 2px 6px 2px 5px; border: 2px solid var(--ink); border-radius: 999px; background: var(--bg); font-weight: 700; }
  .chip i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--ink); display: inline-block; }
  .chip.off { opacity: .35; }

  #ctl {
    position: absolute; left: 0; right: 0; bottom: 0; height: var(--ctl-h, 150px); z-index: 2; display: flex; align-items: stretch;
    padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); box-sizing: border-box;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
  }
  #joy { position: relative; flex: 1.35; touch-action: none; }
  #joyBase {
    position: absolute; width: 104px; height: 104px; margin: -52px 0 0 -52px; left: 30%; top: 50%; border-radius: 50%;
    border: 3px solid var(--ink); background: color-mix(in srgb, var(--ink) 7%, transparent); opacity: .55; transition: opacity .15s; pointer-events: none;
  }
  #joy.on #joyBase { opacity: .95; }
  #joyKnob {
    position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%;
    background: var(--ink); opacity: .85; pointer-events: none;
  }
  #joyHint { position: absolute; left: 0; right: 0; bottom: 2px; text-align: center; font-size: 15px; color: var(--muted); pointer-events: none; }
  #bombZone { flex: 1; display: flex; align-items: center; justify-content: center; }
  #bombBtn {
    font: inherit; font-size: 26px; font-weight: 700; width: 96px; height: 96px; border-radius: 50%; cursor: pointer; touch-action: none; line-height: 1.05;
    color: #fff; background: var(--water); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
    transition: transform .06s, box-shadow .06s;
  }
  #bombBtn small { display: block; font-size: 15px; font-weight: 400; opacity: .9; }
  #bombBtn.down { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
  #bombBtn.needle { background: #a35cf0; }
  #bombBtn:disabled { opacity: .4; }

  #panel {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 5; pointer-events: none;
    background: color-mix(in srgb, var(--bg) 45%, transparent);
  }
  #panel[hidden] { display: none; }
  .card {
    width: min(100%, 340px); box-sizing: border-box; text-align: center; pointer-events: auto;
    background: var(--bg); border: 2px solid var(--ink); border-radius: 18px;
    box-shadow: 5px 5px 0 var(--ink); padding: 22px 20px 20px;
  }
  .card h1 { margin: 0 0 6px; font-size: 40px; line-height: 1.05; text-wrap: balance; }
  .card p { word-break: keep-all; margin: 6px 0; font-size: 20px; line-height: 1.3; color: var(--muted); text-wrap: balance; }
  .card .big { font-size: 46px; font-weight: 700; color: var(--ink); line-height: 1; margin: 10px 0 4px; font-variant-numeric: tabular-nums; }
  .card .row { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 18px; font-size: 20px; color: var(--ink); margin: 6px 0 2px; }
  .card .badge { display: inline-block; margin-top: 4px; padding: 0 12px; border: 2px solid var(--hit); color: var(--hit); border-radius: 999px; font-weight: 700; font-size: 20px; transform: rotate(-3deg); }
  .btn {
    margin-top: 16px; width: 100%; font: inherit; font-size: 28px; font-weight: 700; cursor: pointer;
    color: var(--bg); background: var(--ink); border: 2px solid var(--ink); border-radius: 14px; padding: 8px 12px;
  }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn.sub { margin-top: 10px; font-size: 22px; color: var(--ink); background: transparent; }
  .btn:focus-visible, #bombBtn:focus-visible, #pauseBtn:focus-visible, #soundBtn:focus-visible { outline: 3px solid var(--hit); outline-offset: 2px; }
  .hint { word-break: keep-all; font-size: 17px; color: var(--muted); margin-top: 12px; line-height: 1.3; }
  @media (max-height: 700px) { :root { --ctl-h: 132px; } #bombBtn { width: 84px; height: 84px; font-size: 24px; } #joyBase { width: 92px; height: 92px; margin: -46px 0 0 -46px; } #hud .nums { font-size: 26px; } }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } #timerWrap.hot #timer { animation: none; } }
  html[lang="ja"] * { word-break: normal !important; line-break: strict; }
  html:not([lang="ko"]) #soundBtn, html:not([lang="ko"]) #pauseBtn { white-space: nowrap; font-size: 15px; padding: 2px 10px; }
  html:not([lang="ko"]) #hud .sub { font-size: 17px; white-space: nowrap; }
  html:not([lang="ko"]) #tCoins { white-space: nowrap; }
  html:not([lang="ko"]) .chip { font-size: 12px; padding: 2px 5px 2px 4px; gap: 2px; }
  html:not([lang="ko"]) .chip i { width: 7px; height: 7px; }
  html:not([lang="ko"]) #stats .chips { gap: 3px; }
  .chips.many { gap: 3px; }
  .chips.many .chip { font-size: 11px; padding: 2px 4px 2px 3px; gap: 2px; border-width: 1.5px; }
  .chips.many .chip i { width: 6px; height: 6px; border-width: 1px; }
  html:not([lang="ko"]) #joyHint { font-size: 12px; white-space: nowrap; }
</style>

</head>
<body>
<div id="stage">
  <canvas id="cv" data-a="aria-label:canvasLabel"></canvas>
  <div id="top">
    <div id="hud" class="gutter">
      <div>
        <div class="nums"><span id="tStage"></span></div>
        <div class="sub"><span data-i="scoreL"></span> <span id="tScore">0</span> · <span data-i="foesHud"></span> <span id="tFoes">1</span></div>
      </div>
      <div class="right"><span><span data-i="bestL"></span> <span id="tBest">0</span><span data-i="unit"></span></span><div class="btns"><button id="soundBtn" type="button" aria-pressed="true"></button><button id="pauseBtn" type="button" hidden data-i="pause"></button></div></div>
    </div>
    <div id="timerWrap" class="gutter"><div id="timer" data-a="aria-label:timeLeft"><div id="timerFill"></div></div><span id="timerNum">0</span></div>
  </div>
  <div id="toast" aria-live="polite"></div>
  <div id="stats" class="gutter"><div class="chips" id="chips"></div></div>
  <div id="ctl">
    <div id="joy"><div id="joyBase"><div id="joyKnob"></div></div><div id="joyHint" data-i="joyHint"></div></div>
    <div id="bombZone"><button id="bombBtn" type="button"></button></div>
  </div>
  <div id="panel" class="gutter"><div class="card" id="card"></div></div>
</div>

<script>
(() => {
  "use strict";

  /* ---------- 문구: 나중에 다국어(ko/en/ja/es)로 확장하기 쉽게 한곳에 모음 ---------- */
  const TT = {
    ko: {
    title: "크레이지 아케이드",
    readyDesc: "물풍선으로 상자를 부수고 상대를 물방울에 가두세요. 마지막까지 살아남으면 다음 판!",
    readyHint: "물줄기에 맞으면 물방울에 갇혀요 (5초 안에 못 나오면 탈락)\n갇힌 상대에게 닿으면 물방울이 터져요\n바늘이 있으면 풍선 버튼으로 탈출!\n시간이 끝나면 바깥부터 막혀요\n(키보드: 방향키·WASD + 스페이스)",
    start: "시작", retry: "다시 도전", resume: "계속하기", paused: "잠깐 멈춤",
    overTitle: "물방울에 갇혔어요!", overTitleSd: "벽에 막혔어요!", unit: "점", stageWord: "판", best: "최고", newBest: "새 기록!",
    foes: "남은 상대", sec: "초", sudden: "막힘!", suddenToast: "서든데스! 바깥부터 막혀요",
    go: "시작!", clear: "클리어!", trapped: "갇혔다!", pop: "펑!", bonus: n => `보너스 +${n}`,
    chips: { bal: "풍선", pow: "물줄기", spd: "속도", nee: "바늘", shd: "보호막" },
    bombLabel: "풍선", bombSub: "놓기", needleLabel: "바늘", needleSub: "탈출!",
    share: "점수 공유", shareCopied: "문구를 복사했어요", shareFail: "복사하지 못했어요",
    shareText: (st, sc) => `크레이지 아케이드에서 ${st}판까지 ${sc}점! 도전해 보세요`,
    themes: ["잔디밭", "사막", "바닷가", "눈밭", "밤놀이터"],
    ranks: [[2, "몸풀기 단계예요"], [4, "물풍선 좀 던져 본 솜씨예요"], [7, "꽤 능숙한 물풍선 파이터예요"], [11, "물풍선 달인이에요"], [Infinity, "전설의 물풍선 대장이에요"]],
      canvasLabel: "크레이지 아케이드 게임 화면", sndOn: "소리 켜짐", sndOff: "소리 꺼짐", pause: "멈춤", bestL: "최고", scoreL: "점수",
      stageLabel: n => n + "판", foesHud: "상대", joyHint: "여기를 누르고 밀어서 이동", timeLeft: "남은 시간"
    },
    en: {
      title: "Water Balloon\nBattle",
      readyDesc: "Blow up boxes with water balloons and trap your rivals in bubbles. Outlast them to reach the next stage!",
      readyHint: "Get hit by water and you're trapped in a bubble (out if you can't escape in 5 sec)\nTouch a trapped rival to pop their bubble\nWith a needle, use the balloon button to escape!\nWhen time runs out, walls close in from the edge\n(Keyboard: arrows/WASD + Space)",
      start: "Start", retry: "Try again", resume: "Resume", paused: "Paused",
      overTitle: "You got bubbled!", overTitleSd: "Walled in!", unit: " pts", best: "Best", newBest: "New record!",
      foes: "Rivals left", sec: "s", sudden: "Walled!", suddenToast: "Sudden death! Walls close in from the edge",
      go: "Go!", clear: "Clear!", trapped: "Trapped!", pop: "Pop!", bonus: n => `Bonus +${n}`,
      chips: { bal: "Balloon", pow: "Range", spd: "Speed", nee: "Needle", shd: "Shield" },
      bombLabel: "Balloon", bombSub: "Place", needleLabel: "Needle", needleSub: "Escape!",
      share: "Share score", shareCopied: "Copied to clipboard", shareFail: "Couldn't copy",
      shareText: (st, sc) => `Reached stage ${st} with ${sc} pts in Water Balloon Battle! Give it a try`,
      themes: ["Meadow", "Desert", "Beach", "Snowfield", "Night Playground"],
      ranks: [[2, "Just warming up"], [4, "You've thrown a few balloons"], [7, "A pretty skilled balloon fighter"], [11, "A balloon master"], [Infinity, "The legendary balloon boss"]],
      canvasLabel: "Water Balloon Battle game screen", sndOn: "Sound on", sndOff: "Sound off", pause: "Pause", bestL: "Best", scoreL: "Score",
      stageLabel: n => "Stage " + n, foesHud: "Rivals", joyHint: "Slide here to move", timeLeft: "Time left"
    },
    ja: {
      title: "水風船バトル",
      readyDesc: "水風船で箱をこわして、相手を水玉にとじこめよう。最後まで生き残れば次の面へ！",
      readyHint: "水に当たると水玉にとじこめられる（5秒以内に出られないと脱落）\nとじこめられた相手にさわると水玉がはじける\n針があれば風船ボタンで脱出！\n時間切れになると外側からふさがれる\n（キーボード：方向キー・WASD＋スペース）",
      start: "スタート", retry: "もう一度", resume: "再開", paused: "一時停止中",
      overTitle: "水玉にとじこめられた！", overTitleSd: "壁にふさがれた！", unit: "点", best: "ベスト", newBest: "新記録！",
      foes: "残りの相手", sec: "秒", sudden: "ふさがれ！", suddenToast: "サドンデス！外側からふさがれるよ",
      go: "スタート！", clear: "クリア！", trapped: "とじこめられた！", pop: "パン！", bonus: n => `ボーナス +${n}`,
      chips: { bal: "風船", pow: "水流", spd: "速度", nee: "針", shd: "バリア" },
      bombLabel: "風船", bombSub: "置く", needleLabel: "針", needleSub: "脱出！",
      share: "スコアを共有", shareCopied: "コピーしました", shareFail: "コピーできませんでした",
      shareText: (st, sc) => `水風船バトルで${st}面まで${sc}点！挑戦してみて`,
      themes: ["芝生", "砂漠", "海辺", "雪原", "夜の遊び場"],
      ranks: [[2, "ウォーミングアップ中"], [4, "水風船を投げ慣れてきた"], [7, "かなりの腕前の水風船ファイター"], [11, "水風船の達人"], [Infinity, "伝説の水風船ボス"]],
      canvasLabel: "水風船バトル ゲーム画面", sndOn: "音 ON", sndOff: "音 OFF", pause: "一時停止", bestL: "ベスト", scoreL: "スコア",
      stageLabel: n => n + "面", foesHud: "相手", joyHint: "ここをスライドして移動", timeLeft: "残り時間"
    },
    es: {
      title: "Batalla de\nGlobos de Agua",
      readyDesc: "Revienta cajas con globos de agua y atrapa a tus rivales en burbujas. ¡Sobrevive hasta el final para pasar de nivel!",
      readyHint: "Si te da el agua, quedas atrapado en una burbuja (eliminado si no escapas en 5 s)\nToca a un rival atrapado para reventar su burbuja\n¡Con una aguja, escapa con el botón de globo!\nCuando se acaba el tiempo, los muros avanzan desde el borde\n(Teclado: flechas/WASD + Espacio)",
      start: "Empezar", retry: "Reintentar", resume: "Continuar", paused: "En pausa",
      overTitle: "¡Te atrapó la burbuja!", overTitleSd: "¡Te encerró el muro!", unit: " pts", best: "Récord", newBest: "¡Nuevo récord!",
      foes: "Rivales restantes", sec: "s", sudden: "¡Muro!", suddenToast: "¡Muerte súbita! Los muros avanzan desde el borde",
      go: "¡Ya!", clear: "¡Completado!", trapped: "¡Atrapado!", pop: "¡Pum!", bonus: n => `Bonus +${n}`,
      chips: { bal: "Globos", pow: "Alcance", spd: "Veloc.", nee: "Aguja", shd: "Escudo" },
      bombLabel: "Globo", bombSub: "Poner", needleLabel: "Aguja", needleSub: "¡Escapa!",
      share: "Compartir puntos", shareCopied: "Texto copiado", shareFail: "No se pudo copiar",
      shareText: (st, sc) => `¡Llegué al nivel ${st} con ${sc} pts en Batalla de Globos de Agua! Atrévete a jugar`,
      themes: ["Césped", "Desierto", "Playa", "Nieve", "Parque nocturno"],
      ranks: [[2, "Entrando en calor"], [4, "Ya lanzaste algunos globos"], [7, "Un luchador de globos bastante hábil"], [11, "Maestro de los globos"], [Infinity, "El legendario jefe de los globos"]],
      canvasLabel: "Pantalla del juego Batalla de Globos de Agua", sndOn: "Sonido sí", sndOff: "Sonido no", pause: "Pausa", bestL: "Récord", scoreL: "Puntos",
      stageLabel: n => "Nivel " + n, foesHud: "Rivales", joyHint: "Desliza aquí para moverte", timeLeft: "Tiempo restante"
    }
  };
  const LANG = (() => { try { const l = new URLSearchParams(location.search).get("lang"); if (l === "ko" || l === "en" || l === "ja" || l === "es") return l; } catch (e) {} return "ko"; })();
  const T = TT[LANG] || TT.ko;
  (function applyStatic() {
    const d = document;
    d.documentElement.lang = LANG;
    d.title = T.title.replace(/\n/g, " ");
    d.querySelectorAll("[data-i]").forEach(el => { const v = T[el.getAttribute("data-i")]; if (typeof v === "string") el.textContent = v; });
    d.querySelectorAll("[data-a]").forEach(el => { const p = el.getAttribute("data-a").split(":"); if (T[p[1]]) el.setAttribute(p[0], T[p[1]]); });
    const s = d.getElementById("tStage"); if (s) s.textContent = T.stageLabel(1);
    d.getElementById("bombBtn").innerHTML = T.bombLabel + "<small>" + T.bombSub + "</small>";
  })();


  /* ---------- 설정값(한곳에 모음) ---------- */
  const CFG = {
    cols: 9, rows: 11,
    fuse: 2.4, waterT: 0.45, trapT: 5.0, trapSpeed: 0.28,        // 풍선 터지기까지 / 물줄기 지속 / 갇혀 있는 시간 / 갇힌 동안 속도 비율

    ctx.fillStyle = P.boxD; ctx.beginPath(); ctx.roundRect(x + pad, y + pad, w, w, ts * 0.1); ctx.fill(); ctx.stroke();
    ctx.fillStyle = P.box; ctx.beginPath(); ctx.roundRect(x + pad, y + pad, w, w - d, ts * 0.1); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = P.boxD; ctx.lineWidth = Math.max(2, ts * 0.07);
    ctx.beginPath(); ctx.moveTo(x + pad + w * 0.18, y + pad + (w - d) * 0.5); ctx.lineTo(x + pad + w * 0.82, y + pad + (w - d) * 0.5);
    ctx.moveTo(x + pad + w * 0.5, y + pad + (w - d) * 0.2); ctx.lineTo(x + pad + w * 0.5, y + pad + (w - d) * 0.8); ctx.stroke();
    ctx.fillStyle = P.boxL; ctx.globalAlpha = 0.8; ctx.beginPath(); ctx.roundRect(x + pad + ts * 0.07, y + pad + ts * 0.06, w * 0.4, ts * 0.07, ts * 0.03); ctx.fill(); ctx.globalAlpha = 1;
  }
  const ITEM_COL = { bal: "#8fd0ff", pow: "#ffab8a", spd: "#9be58f", nee: "#d6b3ff", shd: "#ffe08a" };
  function drawItem(type, cx, cy, tm, seed) {
    const bob = Math.sin(tm * 4 + seed) * ts * 0.04, r = ts * 0.31, y = cy + bob;
    ctx.save(); ctx.translate(cx, y); ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.beginPath(); ctx.ellipse(0, r * 1.05 - bob, r * 0.8, r * 0.28, 0, 0, 6.3); ctx.fill();
    ctx.fillStyle = ITEM_COL[type]; ctx.strokeStyle = TINK; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.3); ctx.fill(); ctx.stroke();
    ctx.lineWidth = 2; ctx.fillStyle = "#fff";
    if (type === "bal") { ctx.fillStyle = "#3fa7ff"; ctx.beginPath(); ctx.ellipse(0, -r * 0.1, r * 0.42, r * 0.5, 0, 0, 6.3); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, r * 0.4); ctx.lineTo(r * 0.15, r * 0.7); ctx.stroke(); }
    else if (type === "pow") { ctx.fillStyle = "#ff5d3a"; ctx.beginPath(); ctx.moveTo(0, -r * 0.72); ctx.bezierCurveTo(r * 0.7, -r * 0.1, r * 0.6, r * 0.6, 0, r * 0.62); ctx.bezierCurveTo(-r * 0.6, r * 0.6, -r * 0.7, -r * 0.1, 0, -r * 0.72); ctx.fill(); ctx.stroke(); }
    else if (type === "spd") { ctx.strokeStyle = TINK; ctx.lineWidth = 3; for (const o of [-0.3, 0.12]) { ctx.beginPath(); ctx.moveTo(r * o - r * 0.12, -r * 0.45); ctx.lineTo(r * o + r * 0.3, 0); ctx.lineTo(r * o - r * 0.12, r * 0.45); ctx.stroke(); } }
    else if (type === "nee") { ctx.strokeStyle = TINK; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-r * 0.5, r * 0.5); ctx.lineTo(r * 0.38, -r * 0.38); ctx.stroke(); ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(r * 0.5, -r * 0.5, r * 0.2, 0, 6.3); ctx.fill(); ctx.lineWidth = 2; ctx.stroke(); }
    else { ctx.fillStyle = "#f2a516"; ctx.beginPath(); ctx.moveTo(-r * 0.5, -r * 0.5); ctx.lineTo(r * 0.5, -r * 0.5); ctx.lineTo(r * 0.5, r * 0.1); ctx.quadraticCurveTo(r * 0.45, r * 0.55, 0, r * 0.72); ctx.quadraticCurveTo(-r * 0.45, r * 0.55, -r * 0.5, r * 0.1); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    ctx.restore();
  }
  function drawBalloon(b, tm) {
    const { x, y } = cpx(b.r, b.c), cx = x + ts / 2, cy = y + ts / 2;
    const ph = CFG.fuse - b.t, s = 1 + 0.07 * Math.sin(tm * (6 + ph * 5)), r = ts * 0.34 * s;
    ctx.save(); ctx.translate(cx, cy + ts * 0.03); ctx.lineJoin = "round";
    ctx.fillStyle = "rgba(0,0,0,.2)"; ctx.beginPath(); ctx.ellipse(0, r * 0.95, r * 0.8, r * 0.26, 0, 0, 6.3); ctx.fill();
    ctx.fillStyle = b.owner.color; ctx.strokeStyle = TINK; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.ellipse(0, 0, r, r * 1.04, 0, 0, 6.3); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-r * 0.12, r * 1.0); ctx.lineTo(0, r * 1.22); ctx.lineTo(r * 0.12, r * 1.0); ctx.closePath(); ctx.fill(); ctx.stroke();
    if (b.t < 0.7 && Math.floor(tm * 16) % 2 === 0) { ctx.fillStyle = "rgba(255,255,255,.7)"; ctx.beginPath(); ctx.ellipse(0, 0, r, r * 1.04, 0, 0, 6.3); ctx.fill(); }
    ctx.fillStyle = "rgba(255,255,255,.7)"; ctx.beginPath(); ctx.ellipse(-r * 0.38, -r * 0.4, r * 0.2, r * 0.3, -0.5, 0, 6.3); ctx.fill();
    ctx.restore();
  }
  function splashShape(sp) {
    const { x, y } = cpx(sp.r, sp.c), th = ts * 0.64, cy = y + ts / 2, cx = x + ts / 2, k = sp.kind, rad = th / 2;
    ctx.beginPath();
    if (k === "c") { ctx.rect(x - 1, cy - th / 2, ts + 2, th); ctx.rect(cx - th / 2, y - 1, th, ts + 2); }
    else if (k === "h") ctx.rect(x - 1, cy - th / 2, ts + 2, th);
    else if (k === "v") ctx.rect(cx - th / 2, y - 1, th, ts + 2);
    else if (k === "l") ctx.roundRect(x, cy - th / 2, ts + 1, th, [rad, 0, 0, rad]);
    else if (k === "r") ctx.roundRect(x - 1, cy - th / 2, ts + 1, th, [0, rad, rad, 0]);
    else if (k === "u") ctx.roundRect(cx - th / 2, y, th, ts + 1, [rad, rad, 0, 0]);
    else ctx.roundRect(cx - th / 2, y - 1, th, ts + 1, [0, 0, rad, rad]);
  }
  function drawSplashes(tm) {
    if (!splashes.length) return;
    ctx.save(); ctx.lineJoin = "round";
    const al = sp => sp.age < 0.06 ? sp.age / 0.06 : sp.age > CFG.waterT - 0.14 ? clamp((CFG.waterT - sp.age) / 0.14, 0, 1) : 1;
    ctx.strokeStyle = TINK; ctx.lineWidth = 5;
    for (const sp of splashes) { ctx.globalAlpha = al(sp); splashShape(sp); ctx.stroke(); }
    ctx.fillStyle = "#6fd0ff";
    for (const sp of splashes) { ctx.globalAlpha = al(sp); splashShape(sp); ctx.fill(); }
    ctx.strokeStyle = "rgba(255,255,255,.75)"; ctx.lineWidth = Math.max(2, ts * 0.06);
    for (const sp of splashes) {
      ctx.globalAlpha = al(sp); const { x, y } = cpx(sp.r, sp.c), cx = x + ts / 2, cy = y + ts / 2, k = sp.kind;
      ctx.beginPath();
      if (k === "h" || k === "l" || k === "r" || k === "c") { ctx.moveTo(x + ts * 0.12, cy - ts * 0.12); ctx.lineTo(x + ts * 0.88, cy - ts * 0.12); }
      if (k === "v" || k === "u" || k === "d" || k === "c") { ctx.moveTo(cx - ts * 0.12, y + ts * 0.12); ctx.lineTo(cx - ts * 0.12, y + ts * 0.88); }
      ctx.stroke();
    }
    ctx.restore();
  }
  function accessory(e, R, tm) {
    ctx.lineJoin = "round"; ctx.lineWidth = 2; ctx.strokeStyle = TINK;
    if (e.human) {                                                // 모자
      ctx.fillStyle = "#ffd23f"; ctx.beginPath(); ctx.arc(0, -R * 0.5, R * 0.82, Math.PI * 1.08, Math.PI * 1.92); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.roundRect(-R * 0.12, -R * 1.45, R * 0.24, R * 0.3, R * 0.1); ctx.fill(); ctx.stroke();
    } else if (e.acc === 0) {                                     // 귀
      ctx.fillStyle = e.color; for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(s * R * 0.7, -R * 0.82, R * 0.3, 0, 6.3); ctx.fill(); ctx.stroke(); }
    } else if (e.acc === 1) {                                     // 더듬이
      ctx.beginPath(); ctx.moveTo(0, -R * 0.95); ctx.lineTo(R * 0.12, -R * 1.5); ctx.stroke(); ctx.fillStyle = "#ffd23f"; ctx.beginPath(); ctx.arc(R * 0.12, -R * 1.55, R * 0.2, 0, 6.3); ctx.fill(); ctx.stroke();
    } else {                                                      // 뿔
      ctx.fillStyle = "#fff"; for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(s * R * 0.35, -R * 0.85); ctx.lineTo(s * R * 0.75, -R * 1.45); ctx.lineTo(s * R * 0.78, -R * 0.62); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    }
  }
  function drawEnt(e, tm) {
    const px = gx + e.x * ts, bob = e.moving ? Math.sin(e.walkT * 16) * ts * 0.03 : Math.sin(tm * 3 + e.id) * ts * 0.01;
    const R = ts * 0.36, trap = e.trapped > 0;
    let py = gy + e.y * ts;
    if (trap) py += Math.sin(tm * 3 + e.id) * ts * 0.05 - ts * 0.04;
    ctx.save();
    if (e.invuln > 0 && Math.floor(tm * 16) % 2 === 0) ctx.globalAlpha = 0.45;
    ctx.fillStyle = "rgba(0,0,0,.2)"; ctx.beginPath(); ctx.ellipse(px, gy + e.y * ts + R * 0.95, R * 0.85, R * 0.3, 0, 0, 6.3); ctx.fill();
    ctx.translate(px, py + bob);
    if (trap) ctx.scale(0.82, 0.82);
    ctx.lineJoin = "round"; ctx.lineWidth = 2.4; ctx.strokeStyle = TINK;
    accessory(e, R, tm);
    ctx.fillStyle = e.color; ctx.beginPath(); ctx.arc(0, 0, R, 0, 6.3); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.28)"; ctx.beginPath(); ctx.ellipse(-R * 0.3, -R * 0.45, R * 0.32, R * 0.2, -0.5, 0, 6.3); ctx.fill();
    const dv = [[0, -1], [1, 0], [0, 1], [-1, 0]][e.dir];
    ctx.lineWidth = 1.6;
    for (const s of [-1, 1]) {
      const ex = s * R * 0.36 + dv[0] * R * 0.1, ey = -R * 0.08 + dv[1] * R * 0.1;
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(ex, ey, R * 0.24, R * 0.28, 0, 0, 6.3); ctx.fill(); ctx.stroke();
      ctx.fillStyle = TINK; ctx.beginPath(); ctx.arc(ex + dv[0] * R * 0.09, ey + dv[1] * R * 0.1, R * 0.12, 0, 6.3); ctx.fill();
    }
    ctx.beginPath(); if (trap) { ctx.arc(0, R * 0.5, R * 0.14, 0, 6.3); } else { ctx.arc(0, R * 0.34, R * 0.2, 0.15, Math.PI - 0.15); } ctx.stroke();
    ctx.restore();
    if (trap) {                                                    // 물방울 + 남은 시간 고리
      const br = ts * 0.58, left = e.trapped / CFG.trapT, low = e.trapped < 1.5;
      ctx.save(); ctx.translate(px, py);
      ctx.fillStyle = "rgba(143,208,255,.45)"; ctx.strokeStyle = TINK; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.arc(0, 0, br, 0, 6.3); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, br * 0.78, Math.PI * 1.1, Math.PI * 1.45); ctx.stroke();
      ctx.strokeStyle = low && Math.floor(tm * 10) % 2 === 0 ? "#fff" : (low ? "#e5484d" : "#2b7de0"); ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(0, 0, br + 4, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * left); ctx.stroke();
      ctx.restore();
    }
    if (e.shield) {
      ctx.save(); ctx.translate(px, py); ctx.rotate(tm * 2); ctx.strokeStyle = "#f2a516"; ctx.lineWidth = 3; ctx.setLineDash([6, 5]);
      ctx.beginPath(); ctx.arc(0, 0, R * 1.35, 0, 6.3); ctx.stroke(); ctx.restore();
    }
    if (e.human) {                                                 // 내 캐릭터 표시(머리 위 삼각형)
      const y = py - ts * 0.62 + Math.sin(tm * 5) * 2;
      ctx.save(); ctx.fillStyle = "#fff"; ctx.strokeStyle = TINK; ctx.lineWidth = 2; ctx.lineJoin = "round";
      ctx.beginPath(); ctx.moveTo(px - ts * 0.13, y - ts * 0.15); ctx.lineTo(px + ts * 0.13, y - ts * 0.15); ctx.lineTo(px, y); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
    }
  }
  function drawBoard(tm, P) {
    const bw = COLS * ts, bh = ROWS * ts;
    ctx.save();
    ctx.fillStyle = P.f1; ctx.strokeStyle = C.ink; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.roundRect(gx - 4, gy - 4, bw + 8, bh + 8, 10); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.roundRect(gx, gy, bw, bh, 4); ctx.clip();
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) { ctx.fillStyle = (r + c) % 2 ? P.f2 : P.f1; ctx.fillRect(gx + c * ts, gy + r * ts, ts + 0.5, ts + 0.5); }
    if (sd) {                                                      // 곧 막힐 칸 경고
      for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
        const m = doom[r][c];
        if (g[r][c] !== 1 && m < 1.4) { ctx.fillStyle = `rgba(229,72,77,${0.25 + 0.3 * Math.abs(Math.sin(tm * 12))})`; ctx.fillRect(gx + c * ts, gy + r * ts, ts, ts); }
      }
    }
    ctx.restore();
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const { x, y } = cpx(r, c);
      if (g[r][c] === 1) drawWall(x, y, P, sdWall[r][c]);
      else if (g[r][c] === 2) drawBox(x, y, P);
      else if (itemG[r][c]) drawItem(itemG[r][c].type, x + ts / 2, y + ts / 2, tm, r * 7 + c);
    }
    for (const b of balloons) drawBalloon(b, tm);
    drawSplashes(tm);
    for (const e of ents.slice().sort((a, b) => a.y - b.y)) if (e.alive) drawEnt(e, tm);
    for (const q of parts) {
      ctx.globalAlpha = Math.max(0, 1 - q.age / q.life); ctx.fillStyle = q.col; ctx.beginPath();
      ctx.arc(gx + q.x * ts, gy + q.y * ts, q.r, 0, 6.3); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (const f of floats) {
      ctx.globalAlpha = Math.max(0, 1 - f.age); ctx.font = `700 ${f.big ? 26 : 20}px ${FONT}`; ctx.textAlign = "center";
      const fx = gx + f.x * ts, fy = gy + f.y * ts - f.age * 30;
      ctx.lineWidth = 4; ctx.strokeStyle = "#fffdf5"; ctx.strokeText(f.text, fx, fy);
      ctx.fillStyle = f.big ? "#e5484d" : TINK; ctx.fillText(f.text, fx, fy);
    }
    ctx.globalAlpha = 1;
  }
  function bigText(text, x, y, size, fill) {
    ctx.save(); ctx.font = `700 ${size}px ${FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
    ctx.lineWidth = Math.max(5, size * 0.12); ctx.strokeStyle = TINK; ctx.strokeText(text, x, y);
    ctx.fillStyle = fill || "#fff"; ctx.fillText(text, x, y); ctx.restore();
  }
  function drawOverlay(tm, P) {
    const cx = gx + COLS * ts / 2, cy = gy + ROWS * ts / 2;
    if (state !== "play" && state !== "pause") return;
    if (phase === "intro") {
      bigText(`${T.stageLabel(stage)} · ${T.themes[mod(stage - 1, T.themes.length)]}`, cx, cy - ts * 2.3, Math.min(34, ts * 0.85), "#ffd23f");
      const n = introN, k = (CFG.introT / 3 - ((CFG.introT - phaseT) % (CFG.introT / 3))) / (CFG.introT / 3);
      ctx.save(); ctx.globalAlpha = clamp(1.3 - k * 0.6, 0.3, 1); bigText(String(n), cx, cy, ts * 3.2 * (1 + (1 - k) * 0.15)); ctx.restore();
    } else if (goT > 0) { ctx.save(); ctx.globalAlpha = clamp(goT / 0.4, 0, 1); bigText(T.go, cx, cy, ts * 1.9, "#ffd23f"); ctx.restore(); }
    else if (phase === "clear") bigText(T.clear, cx, cy, ts * 2.2, "#ffd23f");
    else if (phase === "lost") bigText(overBySd ? T.sudden : T.pop, cx, cy, ts * 2, "#ff8a8a");
  }
  function drawTension(tm) {                                       // 급해지면 화면 가장자리가 붉게 깜빡임
    if (S.ten < 0.05 || state !== "play") return;
    const a = S.ten * (0.2 + 0.14 * Math.sin(tm * (4 + 8 * S.ten)));
    const gr = ctx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * 0.35, VW / 2, VH / 2, Math.max(VW, VH) * 0.75);
    gr.addColorStop(0, "rgba(229,72,77,0)"); gr.addColorStop(1, `rgba(229,72,77,${clamp(a, 0, 0.45)})`);
    ctx.fillStyle = gr; ctx.fillRect(0, 0, VW, VH);
  }
  function render(tm) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const P = palette();
    drawBg(tm, P);
    ctx.save();
    if (shakeT > 0 && !reduceMotion) ctx.translate(rnd(-1, 1) * shakeT * 14, rnd(-1, 1) * shakeT * 14);
    drawBoard(tm, P);
    ctx.restore();
    drawOverlay(tm, P); drawTension(tm);
  }

  /* ================= 메인 루프 ================= */
  let last = performance.now(), errOnce = false;
  function frame(now) {
    requestAnimationFrame(frame);                                  // 오류가 나도 루프가 끊기지 않게 먼저 예약
    const dt = Math.min(0.05, (now - last) / 1000 || 0.016); last = now;
    try { if (state !== "pause") update(dt); render(now / 1000); }
    catch (e) { if (!errOnce) { errOnce = true; console.error(e); } }
  }

  /* ---------- 시작 ---------- */
  readColors(); startStage(); paintSound(); showReady(); layout();
  requestAnimationFrame(frame);
})();
</script>

</body>
