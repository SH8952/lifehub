<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>막대기 인간 똥피하기</title>
<style>
  @font-face { font-family: "Gaegu"; font-style: normal; font-weight: 400; font-display: swap; src: url("/games/fonts/gaegu-400.woff2") format("woff2"); }
  @font-face { font-family: "Gaegu"; font-style: normal; font-weight: 700; font-display: swap; src: url("/games/fonts/gaegu-700.woff2") format("woff2"); }
</style>
<style>
  /* Layout concept: a sheet of paper that fills the phone. Pencil-line stick figure at the bottom, doodled poop falling from the top. */
  :root {
    --bg: #fdfdfb;
    --ink: #1c2331;
    --poop: #d9c3a0;
    --hit: #e5484d;
    --muted: #6a7282;
    --font-hand: "Gaegu", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171f; --ink: #e8ebf2; --poop: #6a5640; --hit: #ff6b70; --muted: #98a1b3;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14171f; --ink: #e8ebf2; --poop: #6a5640; --hit: #ff6b70; --muted: #98a1b3;
    color-scheme: dark;
  }

  html, body { height: 100%; }
  html { overscroll-behavior: none; }
  body {
    margin: 0; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: var(--font-hand); overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: relative; width: 100%; max-width: 480px; height: 100%;
    margin: 0 auto; touch-action: none; overflow: hidden;
    background: var(--bg);
    border-left: 1px solid color-mix(in srgb, var(--ink) 12%, transparent);
    border-right: 1px solid color-mix(in srgb, var(--ink) 12%, transparent);
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

  #hud {
    position: absolute; inset: 0 0 auto 0; display: flex; justify-content: space-between; align-items: flex-start;
    padding-top: 12px; pointer-events: none; font-weight: 700; line-height: 1.05; z-index: 3;
  }
  #hud .nums { font-size: 30px; font-variant-numeric: tabular-nums; }
  #hud .nums small { font-size: 16px; font-weight: 400; color: var(--muted); margin-left: 6px; }
  #hud .right { text-align: right; font-size: 18px; color: var(--muted); font-weight: 400; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  #pauseBtn, #soundBtn {
    pointer-events: auto; font: inherit; font-size: 18px; color: var(--ink); background: transparent;
    border: 2px solid var(--ink); border-radius: 999px; padding: 2px 14px; cursor: pointer;
  }
  #hud .btns { display: flex; gap: 8px; }
  #soundBtn[aria-pressed="false"] { color: var(--muted); border-color: var(--muted); }
  #toast {
    position: absolute; left: 0; right: 0; top: 22%; text-align: center; pointer-events: none;
    font-size: 40px; font-weight: 700; color: var(--hit); opacity: 0; transform: scale(.9);
    transition: opacity .25s, transform .25s;
  }
  #toast.show { opacity: 1; transform: scale(1); }

  #panel {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 2; pointer-events: none;
    background: color-mix(in srgb, var(--bg) 55%, transparent);
  }
  #panel[hidden] { display: none; }
  .card {
    width: min(100%, 340px); box-sizing: border-box; text-align: center; pointer-events: auto;
    background: var(--bg); border: 2px solid var(--ink); border-radius: 18px;
    box-shadow: 5px 5px 0 var(--ink); padding: 22px 20px 20px;
  }
  .card h1 { margin: 0 0 6px; font-size: 38px; line-height: 1.05; text-wrap: balance; }
  .card p { margin: 6px 0; font-size: 20px; line-height: 1.3; color: var(--muted); text-wrap: balance; }
  .card .big { font-size: 46px; font-weight: 700; color: var(--ink); line-height: 1; margin: 10px 0 4px; font-variant-numeric: tabular-nums; }
  .card .row { display: flex; justify-content: center; gap: 22px; font-size: 20px; color: var(--ink); margin: 6px 0 2px; }
  .card .badge { display: inline-block; margin-top: 4px; padding: 0 12px; border: 2px solid var(--hit); color: var(--hit); border-radius: 999px; font-weight: 700; font-size: 20px; transform: rotate(-3deg); }
  .btn {
    margin-top: 16px; width: 100%; font: inherit; font-size: 28px; font-weight: 700; cursor: pointer;
    color: var(--bg); background: var(--ink); border: 2px solid var(--ink); border-radius: 14px; padding: 8px 12px;
  }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn:focus-visible, #pauseBtn:focus-visible, #soundBtn:focus-visible { outline: 3px solid var(--hit); outline-offset: 2px; }
  .hint { font-size: 17px; color: var(--muted); margin-top: 12px; }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
  html[lang="ja"] * { word-break: normal !important; line-break: strict; }
  html:not([lang="ko"]) #soundBtn, html:not([lang="ko"]) #pauseBtn { white-space: nowrap; font-size: 15px; padding: 2px 10px; }
  html:not([lang="ko"]) #hud .sub { font-size: 17px; white-space: nowrap; }
  html:not([lang="ko"]) #tCoins { white-space: nowrap; }
</style>

</head>
<body>
<div id="stage">
  <canvas id="cv" data-a="aria-label:canvasLabel"></canvas>
  <div id="hud" class="gutter">
    <div class="nums"><span id="tTime">0.0</span><small data-i="secondsUnit"></small><br><span id="tDodge">0</span><small data-i="dodgedLabel"></small></div>
    <div class="right"><span><span data-i="bestL"></span> <span id="tBest">0.0</span><span data-i="secondsUnit"></span></span><div class="btns"><button id="soundBtn" type="button" aria-pressed="true"></button><button id="pauseBtn" type="button" hidden data-i="pause"></button></div></div>
  </div>
  <div id="toast" aria-live="polite"></div>
  <div id="panel" class="gutter"><div class="card" id="card"></div></div>
</div>

<script>
(() => {
  "use strict";

  /* ---------- 문구: 나중에 다국어(ko/en/ja/es)로 확장하기 쉽게 한곳에 모음 ---------- */
  const TT = {
    ko: {
    title: "막대기 인간\n똥피하기",
    readyDesc: "위에서 떨어지는 똥을 피하세요.",
    readyHint: "화면을 좌우로 끌어서 움직여요\nPC는 ← → 키",
    start: "시작",
    retry: "다시 하기",
    resume: "계속하기",
    paused: "잠깐 멈춤",
    pause: "멈춤",
    overTitle: "똥 맞았어요!",
    secondsUnit: "초",
    dodgedLabel: "피한 똥",
    bestLabel: "최고",
    newBest: "새 기록!",
    storm: "똥비!",
    ranks: [
      [5, "아직 몸풀기예요"],
      [12, "슬슬 감 잡았어요"],
      [25, "꽤 잘 피하시네요"],
      [45, "똥 피하기 고수예요"],
      [Infinity, "똥 위를 걷는 수준이에요"]
    ],
      canvasLabel: "똥피하기 게임 화면", sndOn: "소리 켜짐", sndOff: "소리 꺼짐", bestL: "최고"
    },
    en: {
      title: "Stickman\nPoop Dodge",
      readyDesc: "Dodge the poop falling from above.",
      readyHint: "Drag left and right to move\nOn PC use the ← → keys",
      start: "Start", retry: "Try again", resume: "Resume", paused: "Paused", pause: "Pause",
      overTitle: "You got hit!", secondsUnit: "s", dodgedLabel: "Dodged", bestLabel: "Best", newBest: "New record!", storm: "Poop storm!",
      ranks: [[5, "Just warming up"], [12, "Getting the hang of it"], [25, "Pretty good at this"], [45, "A poop-dodging pro"], [Infinity, "Practically walking on poop"]],
      canvasLabel: "Stickman Poop Dodge game screen", sndOn: "Sound on", sndOff: "Sound off", bestL: "Best"
    },
    ja: {
      title: "棒人間の\nうんち避け",
      readyDesc: "上から落ちてくるうんちを避けよう。",
      readyHint: "画面を左右にドラッグして動かす\nPCは ← → キー",
      start: "スタート", retry: "もう一回", resume: "再開", paused: "一時停止中", pause: "一時停止",
      overTitle: "うんちが当たった！", secondsUnit: "秒", dodgedLabel: "よけた数", bestLabel: "ベスト", newBest: "新記録！", storm: "うんちの雨！",
      ranks: [[5, "まだウォーミングアップ"], [12, "コツをつかんできた"], [25, "なかなか上手"], [45, "うんち避けの達人"], [Infinity, "うんちの上を歩けるレベル"]],
      canvasLabel: "棒人間のうんち避け ゲーム画面", sndOn: "音 ON", sndOff: "音 OFF", bestL: "ベスト"
    },
    es: {
      title: "Esquiva\nla Caca",
      readyDesc: "Esquiva la caca que cae desde arriba.",
      readyHint: "Arrastra a izquierda y derecha para moverte\nEn PC usa las teclas ← →",
      start: "Empezar", retry: "Reintentar", resume: "Continuar", paused: "En pausa", pause: "Pausa",
      overTitle: "¡Te cayó caca!", secondsUnit: "s", dodgedLabel: "Esquivadas", bestLabel: "Récord", newBest: "¡Nuevo récord!", storm: "¡Lluvia de caca!",
      ranks: [[5, "Aún calentando"], [12, "Le vas agarrando el truco"], [25, "Esquivas bastante bien"], [45, "Un experto esquivando"], [Infinity, "Casi caminas sobre la caca"]],
      canvasLabel: "Pantalla del juego Esquiva la Caca", sndOn: "Sonido sí", sndOff: "Sonido no", bestL: "Récord"
    }
  };
  const LANG = (() => { try { const l = new URLSearchParams(location.search).get("lang"); if (l === "ko" || l === "en" || l === "ja" || l === "es") return l; } catch (e) {} return "ko"; })();
  const T = TT[LANG] || TT.ko;
  (function applyStatic() {
    const d = document;
    d.documentElement.lang = LANG;
    d.title = T.title.replace(/\n/g, " ");
    d.querySelectorAll("[data-i]").forEach(el => { const v = T[el.getAttribute("data-i")]; if (typeof v === "string") el.textContent = v; });
    d.querySelectorAll("[data-a]").forEach(el => { const p = el.getAttribute("data-a").split(":"); if (T[p[1]]) el.setAttribute(p[0], T[p[1]]); });

  })();


  /* ---------- 게임 설정 ---------- */
  const W = 360;                 // 논리 가로 폭(화면 크기와 무관하게 고정)
  const CFG = {
    playerMaxSpeed: 1100, keySpeed: 400, dragGain: 1.25,
    spawnStart: 0.62, spawnMin: 0.14, spawnRamp: 0.01,
    fallBase: 150, fallRamp: 4, fallRampCap: 60, fallJitter: 70,
    stormEvery: 15, stormLength: 2.2
  };

  const $ = id => document.getElementById(id);
  const cv = $("cv"), ctx = cv.getContext("2d");
  const card = $("card"), panel = $("panel");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- 저장(실패해도 게임은 동작) ---------- */
  const KEY = "poop-dodge-best";
  let best = 0;
  try { best = parseFloat(localStorage.getItem(KEY)) || 0; } catch (e) {}
  const saveBest = () => { try { localStorage.setItem(KEY, String(best)); } catch (e) {} };

  /* ---------- 색상(CSS 토큰에서 읽어 라이트/다크 모두 대응) ---------- */
  let C = { bg: "#fff", ink: "#000", poop: "#ccc", hit: "#f00" };
  function readColors() {
    const s = getComputedStyle(document.documentElement);
    for (const k of Object.keys(C)) C[k] = s.getPropertyValue("--" + k).trim() || C[k];
  }
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", readColors);
  new MutationObserver(readColors).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  /* ---------- 상태 ---------- */
  let state = "ready";           // ready | play | pause | over
  let H = 640, scale = 1, dpr = 1, gy = 620;
  let px = W / 2, target = px, vx = 0, phase = 0, kb = 0;
  let t = 0, dodged = 0, spawnT = 0.3, stormUntil = -1, nextStorm = CFG.stormEvery;
  let poops = [], splats = [], parts = [];
  let deadT = 0, deadDir = 1, shake = 0, newBestFlag = false;
  let dragging = false, dragX = 0, dragPx = 0;

  /* ---------- 소리: 배경음악(4단계) + 죽을 때 뿌직 (Web Audio 합성, 음원 파일 없음) ---------- */
  const midi = m => 440 * Math.pow(2, (m - 69) / 12);

  /* ================= 소리 합성 (어떤 AudioContext에서도 동작: 실시간/오프라인 검증 겸용) ================= */
  const noiseCache = new WeakMap();
  function noiseBuf(ac) {
    let b = noiseCache.get(ac);
    if (!b) {
      b = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      noiseCache.set(ac, b);
    }
    return b;
  }
  function env(g, t, a, peak, d) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + a + d);
  }
  function tone(ac, dest, o) {
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = o.type || "sine";
    osc.frequency.setValueAtTime(o.f, o.t);
    if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, o.t + o.dur);
    const a = o.a || 0.006;
    env(g, o.t, a, o.vol, Math.max(o.dur - a, 0.01));
    let out = osc;
    if (o.lp) { const f = ac.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = o.lp; osc.connect(f); out = f; }
    out.connect(g); g.connect(dest);
    if (o.wob) {                                    // 떨림(질퍽한 질감)
      const l = ac.createOscillator(), lg = ac.createGain();
      l.frequency.value = o.wob; lg.gain.value = o.wobDepth || o.f * 0.35;
      l.connect(lg); lg.connect(osc.frequency); l.start(o.t); l.stop(o.t + o.dur + 0.05);
    }
    osc.start(o.t); osc.stop(o.t + o.dur + 0.05);
  }
  function noise(ac, dest, o) {
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noiseBuf(ac); src.loop = true;
    f.type = o.type || "bandpass"; f.Q.value = o.q || 1;
    f.frequency.setValueAtTime(o.f, o.t);
    if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, o.t + o.dur);
    const a = o.a || 0.004;
    env(g, o.t, a, o.vol, Math.max(o.dur - a, 0.01));
    src.connect(f); f.connect(g); g.connect(dest);
    src.start(o.t, Math.random() * 0.5); src.stop(o.t + o.dur + 0.05);
  }

  const BPM = [96, 112, 132, 156];
  const CH = [ { r: 45, t: [69, 72, 76] }, { r: 41, t: [65, 69, 72] }, { r: 48, t: [72, 76, 79] }, { r: 43, t: [67, 71, 74] } ]; // Am F C G
  const kick = (ac, d, t, v) => { tone(ac, d, { t, f: 160, f2: 42, dur: 0.17, vol: v }); noise(ac, d, { t, dur: 0.02, vol: v * 0.2, type: "highpass", f: 3000 }); };
  const snare = (ac, d, t, v) => { noise(ac, d, { t, dur: 0.14, vol: v, type: "bandpass", f: 1900, q: 0.8 }); tone(ac, d, { t, type: "triangle", f: 230, f2: 150, dur: 0.09, vol: v * 0.6 }); };
  const hat = (ac, d, t, v, open) => noise(ac, d, { t, dur: open ? 0.12 : 0.035, vol: v, type: "highpass", f: 7500 });

  function bar(ac, dest, t0, level, bi, sd) {
    const ch = CH[bi % 4], odd = bi % 2 === 1;
    const pad = () => { tone(ac, dest, { t: t0, f: midi(ch.t[0] - 12), dur: sd * 15.5, vol: 0.035, a: 0.4 }); tone(ac, dest, { t: t0, f: midi(ch.t[1] - 12), dur: sd * 15.5, vol: 0.03, a: 0.4 }); };
    for (let s = 0; s < 16; s++) {
      const t = t0 + s * sd;
      if (level === 1) {
        if (s === 0) { tone(ac, dest, { t, type: "triangle", f: midi(ch.r), dur: sd * 7, vol: 0.22 }); pad(); }
        if (s === 8) tone(ac, dest, { t, type: "triangle", f: midi(ch.r), dur: sd * 6, vol: 0.16 });
        const pick = { 4: 0, 10: 1, 14: 2 }[s];
        if (pick !== undefined) tone(ac, dest, { t, f: midi(ch.t[pick]), dur: sd * 3, vol: 0.07 });
      } else if (level === 2) {
        if (s === 0) pad();
        if ([0, 6, 8, 12].includes(s)) tone(ac, dest, { t, type: "triangle", f: midi(ch.r), dur: sd * 2.5, vol: 0.22 });
        if (s === 0 || s === 8) kick(ac, dest, t, 0.5);
        if ([2, 6, 10, 14].includes(s)) hat(ac, dest, t, 0.05);
        if (s % 2 === 0) tone(ac, dest, { t, type: "square", f: midi(ch.t[[0, 1, 2, 1][(s / 2) % 4]]), dur: sd * 1.6, vol: 0.035, lp: 1800 });
      } else if (level === 3) {
        if (s === 0) pad();
        if (s % 2 === 0) tone(ac, dest, { t, type: "sawtooth", f: midi(ch.r + (s % 4 === 2 ? 12 : 0)), dur: sd * 1.6, vol: 0.17, lp: 700 });
        if ([0, 8, 10].includes(s)) kick(ac, dest, t, 0.55);
        if (s === 4 || s === 12) snare(ac, dest, t, 0.22);
        if (s % 2 === 0) hat(ac, dest, t, 0.055, s === 14);
        const idx = [0, 1, 2, 1, 0, 2, 1, 2][s % 8];
        tone(ac, dest, { t, type: "square", f: midi(ch.t[idx]), dur: sd * 1.2, vol: s % 4 === 0 ? 0.05 : 0.03, lp: 2400 });
      } else {
        if (s === 0) {
          pad();
          noise(ac, dest, { t, dur: sd * 16, a: sd * 14, vol: 0.05, type: "bandpass", f: 400, f2: 5000, q: 1.5 });     // 마디마다 차오르는 긴장감
          for (const m of ch.t) tone(ac, dest, { t, type: "sawtooth", f: midi(m), dur: sd * 3, vol: 0.04, lp: 2000 });  // 높은 스탭
        }
        const off = [0, 0, 12, 0, 0, 0, 12, 0, 0, 0, 12, 0, 0, 12, 7, 12][s];
        const tension = odd && s >= 14 ? 1 : 0;                                                                         // 반음 어긋남
        tone(ac, dest, { t, type: "sawtooth", f: midi(ch.r + off + tension), dur: sd * 0.95, vol: 0.14, lp: 900 });
        if (s % 4 === 0) kick(ac, dest, t, 0.58);
        if (s === 4 || s === 12) snare(ac, dest, t, 0.24);
        if (odd && (s === 14 || s === 15)) snare(ac, dest, t, 0.16);
        hat(ac, dest, t, s % 4 === 2 ? 0.07 : 0.045, s % 4 === 2);
        const idx = [0, 2, 1, 2, 0, 2, 1, 2][s % 8];
        tone(ac, dest, { t, type: "sawtooth", f: midi(ch.t[idx] + (s % 8 >= 4 ? 12 : 0)), dur: sd * 0.9, vol: 0.032, lp: 3200 });
      }
    }
  }
  function levelUp(ac, dest, t) {                                  // 단계 상승 효과
    noise(ac, dest, { t, dur: 0.8, a: 0.7, vol: 0.35, type: "bandpass", f: 300, f2: 6000, q: 2 });
    tone(ac, dest, { t, type: "triangle", f: 330, f2: 1320, dur: 0.7, vol: 0.14, a: 0.5 });
  }


  // 죽을 때 나는 뿌직(샘플 A)
  function squelchA(ac, dest, t, vol = 1) {
    const j = 1 + (Math.random() - 0.5) * 0.12;
    noise(ac, dest, { t, dur: 0.22, vol: 0.5 * vol, type: "bandpass", f: 1500 * j, f2: 260 * j, q: 5 });
    tone(ac, dest, { t, dur: 0.2, type: "sawtooth", f: 150 * j, f2: 55 * j, vol: 0.5 * vol, lp: 520, wob: 38, wobDepth: 60 });
    for (const [dt, a, b, d, v] of [[0.09, 340, 130, 0.09, 0.25], [0.15, 260, 100, 0.08, 0.18]]) tone(ac, dest, { t: t + dt, dur: d, f: a * j, f2: b * j, vol: v * vol });
  }

  const MUTE_KEY = "poop-dodge-muted";
  const LEVEL_AT = [15, 30, 45];                    // 1단계 0~15초, 2단계 15~30초, 3단계 30~45초, 4단계 45초~
  let ac = null, master = null, sfxBus = null, bgmBus = null, muted = false;
  try { muted = localStorage.getItem(MUTE_KEY) === "1"; } catch (e) {}
  let audioLevel = 1;
  const S = { timer: null, run: null, level: 1, pending: 1, bar: 0, next: 0 };

  function audioInit() {
    try {
      if (!ac) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return false;
        ac = new Ctx();
        const comp = ac.createDynamicsCompressor();
        master = ac.createGain(); sfxBus = ac.createGain(); bgmBus = ac.createGain();
        sfxBus.gain.value = 0.8; bgmBus.gain.value = 0.6;
        sfxBus.connect(master); bgmBus.connect(master); master.connect(comp); comp.connect(ac.destination);
        applyMute();
      }
      if (ac.state === "suspended") ac.resume();
      return true;
    } catch (e) { ac = null; return false; }
  }
  function applyMute() { if (master) master.gain.value = muted ? 0 : 0.9; }
  function paintSound() {
    const b = $("soundBtn");
    b.textContent = muted ? T.sndOff : T.sndOn;
    b.setAttribute("aria-pressed", muted ? "false" : "true");
  }
  function levelOf(time) { return time < LEVEL_AT[0] ? 1 : time < LEVEL_AT[1] ? 2 : time < LEVEL_AT[2] ? 3 : 4; }

  function bgmTick() {
    if (!ac || !S.run) return;
    while (S.next < ac.currentTime + 0.3) {
      if (S.pending !== S.level) { if (S.pending > S.level) levelUp(ac, S.run, S.next); S.level = S.pending; }
      const sd = 60 / BPM[S.level - 1] / 4;
      bar(ac, S.run, S.next, S.level, S.bar, sd);
      S.next += sd * 16; S.bar++;
    }
  }
  function bgmStart(level, fresh) {
    if (!ac) return;
    bgmStop();
    if (fresh) S.bar = 0;
    S.run = ac.createGain(); S.run.connect(bgmBus);
    S.level = S.pending = level; S.next = ac.currentTime + 0.08;
    bgmTick(); S.timer = setInterval(bgmTick, 50);
  }
  function bgmStop() {
    clearInterval(S.timer); S.timer = null;
    if (S.run && ac) {
      const g = S.run; S.run = null;
      try { g.gain.cancelScheduledValues(ac.currentTime); g.gain.setValueAtTime(g.gain.value, ac.currentTime); g.gain.linearRampToValueAtTime(0, ac.currentTime + 0.1); } catch (e) {}
      setTimeout(() => { try { g.disconnect(); } catch (e) {} }, 400);
    }
  }
  function bgmFollowTime(time) {
    const l = levelOf(time);
    if (l !== audioLevel) { audioLevel = l; S.pending = l; }
  }
  function playDeathSound() { if (ac) squelchA(ac, sfxBus, ac.currentTime + 0.02, 1); }

  /* ---------- 화면 크기 ---------- */
  function resize() {
    const r = $("stage").getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
    scale = r.width / W; H = r.height / scale; gy = H - 26;
    px = Math.min(Math.max(px, 16), W - 16); target = px;
  }
  addEventListener("resize", resize);

  /* ---------- 입력 ---------- */
  const stage = $("stage");
  stage.addEventListener("pointerdown", e => {
    if (state !== "play" || e.target.closest("button")) return;
    dragging = true; dragX = e.clientX; dragPx = px;
    try { stage.setPointerCapture(e.pointerId); } catch (_) {}
  });
  stage.addEventListener("pointermove", e => {
    if (dragging) target = dragPx + (e.clientX - dragX) / scale * CFG.dragGain;
  });
  const endDrag = () => { dragging = false; };
  stage.addEventListener("pointerup", endDrag);
  stage.addEventListener("pointercancel", endDrag);
  stage.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
  stage.addEventListener("contextmenu", e => e.preventDefault());

  addEventListener("keydown", e => {
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") { kb = -1; e.preventDefault(); }
    else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") { kb = 1; e.preventDefault(); }
    else if (e.key === "Escape" && state === "play") setPause(true);
    else if ((e.key === " " || e.key === "Enter") && state !== "play") {
      const b = card.querySelector(".btn");
      if (b && !b.disabled) { e.preventDefault(); b.click(); }
    }
  });
  addEventListener("keyup", e => {
    if (["ArrowLeft", "a", "A"].includes(e.key) && kb < 0) kb = 0;
    if (["ArrowRight", "d", "D"].includes(e.key) && kb > 0) kb = 0;
  });
  document.addEventListener("visibilitychange", () => { if (document.hidden && state === "play") setPause(true); });
  $("pauseBtn").addEventListener("click", () => setPause(true));

  /* ---------- 패널(시작 / 멈춤 / 게임오버) ---------- */
  const nl = s => s.replace(/\n/g, "<br>");
  const fmt = n => n.toFixed(1);
  function showPanel(html) { card.innerHTML = html; panel.hidden = false; }
  function hidePanel() { panel.hidden = true; }

  function showReady() {
    state = "ready"; $("pauseBtn").hidden = true;
    showPanel(`<h1>${nl(T.title)}</h1><p>${T.readyDesc}</p><button class="btn" id="go" type="button">${T.start}</button><div class="hint">${nl(T.readyHint)}</div>`);
    $("go").onclick = startGame;
  }
  function showOver() {
    const rank = T.ranks.find(r => t < r[0])[1];
    showPanel(`<h1>${T.overTitle}</h1>
      <div class="big">${fmt(t)}<span style="font-size:24px"> ${T.secondsUnit}</span></div>
      ${newBestFlag ? `<span class="badge">${T.newBest}</span>` : ""}
      <p>${rank}</p>
      <div class="row"><span>${T.dodgedLabel} ${dodged}</span><span>${T.bestLabel} ${fmt(best)}${T.secondsUnit}</span></div>
      <button class="btn" id="go" type="button" disabled>${T.retry}</button>`);
    const b = $("go"); b.onclick = startGame;
    setTimeout(() => { b.disabled = false; }, 500);
  }
  function setPause(on) {
    if (on && state === "play") {
      state = "pause"; dragging = false; bgmStop();
      showPanel(`<h1>${T.paused}</h1><button class="btn" id="go" type="button">${T.resume}</button>`);
      $("go").onclick = () => { hidePanel(); state = "play"; last = performance.now(); if (audioInit()) bgmStart(audioLevel); };
    }
  }

  /* ---------- 게임 시작 ---------- */
  function startGame() {
    t = 0; dodged = 0; spawnT = 0.4; stormUntil = -1; nextStorm = CFG.stormEvery;
    poops = []; splats = []; parts = []; deadT = 0; shake = 0; newBestFlag = false;
    px = W / 2; target = px; vx = 0; dragging = false;
    state = "play"; hidePanel(); $("pauseBtn").hidden = false; updateHud();
    audioLevel = 1; if (audioInit()) bgmStart(1, true);
    last = performance.now();
  }

  /* ---------- 똥 생성 / 갱신 ---------- */
  function spawn() {
    const s = 24 + Math.random() * 14;
    const aimed = state === "play" && Math.random() < Math.min(0.35, 0.1 + t * 0.01);
    let x = aimed ? px + (Math.random() - 0.5) * 70 : 16 + Math.random() * (W - 32);
    x = Math.min(Math.max(x, s / 2), W - s / 2);
    const vy = CFG.fallBase + Math.min(t, CFG.fallRampCap) * CFG.fallRamp + Math.random() * CFG.fallJitter;
    poops.push({ x, y: -s, s, vy, rot: (Math.random() - 0.5) * 0.4, spin: (Math.random() - 0.5) * 1.2 });
  }
  function toast(msg) {
    const el = $("toast"); el.textContent = msg; el.classList.add("show");
    setTimeout(() => el.classList.remove("show"), 1100);
  }

  function hitsPlayer(p) {
    const pr = p.s * 0.36, cx = p.x, cy = p.y + p.s * 0.05;
    const parts2 = [[px, gy - 30, 7], [px, gy - 16, 9], [px, gy - 5, 8]];
    return parts2.some(([x, y, r]) => (cx - x) ** 2 + (cy - y) ** 2 < (pr + r) ** 2);
  }

  function die() {
    state = "over"; $("pauseBtn").hidden = true; dragging = false;
    bgmStop(); playDeathSound();
    deadT = 0; deadDir = Math.random() < 0.5 ? -1 : 1; shake = reduceMotion ? 0 : 0.35;
    if (t > best) { best = t; newBestFlag = true; saveBest(); }
    for (let i = 0; i < 12; i++) {
      const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 160;
      parts.push({ x: px, y: gy - 20, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 90, life: 0.7 + Math.random() * 0.4, age: 0 });
    }
    setTimeout(() => { if (state === "over") showOver(); }, 700);
  }

  function update(dt) {
    const playing = state === "play";
    if (playing) { t += dt; bgmFollowTime(t); }

    // 이동
    if (playing || state === "ready") {
      if (kb && playing) { px += kb * CFG.keySpeed * dt; target = px; vx = kb * CFG.keySpeed; }
      else {
        const d = target - px, step = Math.max(-CFG.playerMaxSpeed * dt, Math.min(CFG.playerMaxSpeed * dt, d));
        px += step; vx = step / dt;
      }
      px = Math.min(Math.max(px, 16), W - 16);
      if (px === 16 || px === W - 16) target = px;
      phase += Math.abs(vx) * dt * 0.07;
    }

    // 똥 생성
    if (state === "ready" || playing) {
      const storm = playing && t < stormUntil;
      if (playing && t >= nextStorm) { stormUntil = t + CFG.stormLength; nextStorm += CFG.stormEvery; toast(T.storm); }
      const base = playing ? Math.max(CFG.spawnMin, CFG.spawnStart - t * CFG.spawnRamp) : 0.55;
      spawnT -= dt;
      while (spawnT <= 0) { spawn(); spawnT += base * (storm ? 0.4 : 1) * (0.7 + Math.random() * 0.6); }
    }

    // 똥 이동 / 충돌
    for (let i = poops.length - 1; i >= 0; i--) {
      const p = poops[i];
      p.y += p.vy * dt; p.rot += p.spin * dt;
      if (playing && hitsPlayer(p)) { die(); continue; }
      if (p.y + p.s * 0.42 >= gy) {
        splats.push({ x: p.x, w: p.s * 0.95, age: 0 });
        poops.splice(i, 1);
        if (playing) dodged++;
      }
    }
    for (let i = splats.length - 1; i >= 0; i--) { splats[i].age += dt; if (splats[i].age > 1.6) splats.splice(i, 1); }
    for (let i = parts.length - 1; i >= 0; i--) {
      const q = parts[i]; q.age += dt; q.vy += 520 * dt; q.x += q.vx * dt; q.y += q.vy * dt;
      if (q.age > q.life) parts.splice(i, 1);
    }
    if (state === "over") { deadT += dt; shake = Math.max(0, shake - dt); }
    if (playing) updateHud();
  }

  function updateHud() {
    $("tTime").textContent = fmt(t);
    $("tDodge").textContent = dodged;
    $("tBest").textContent = fmt(Math.max(best, t));
  }

  /* ---------- 그리기 ---------- */
  function strokeStyle(w) { ctx.lineWidth = w; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = C.ink; }

  function drawPoop(p) {
    const s = p.s;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    strokeStyle(2); ctx.fillStyle = C.poop;
    const tiers = [[1, 0.3, 0.3], [0.74, 0.28, 0.02], [0.46, 0.26, -0.24]];
    for (const [wr, hr, cy] of tiers) {
      ctx.beginPath(); ctx.ellipse(0, s * cy, s * wr / 2, s * hr / 2 + 1, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(-s * 0.1, -s * 0.34); ctx.quadraticCurveTo(s * 0.02, -s * 0.72, s * 0.1, -s * 0.36);
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }

  function drawPlayer() {
    ctx.save(); ctx.translate(px, gy);
    const dead = state === "over";
    const lean = dead ? 0 : Math.max(-1, Math.min(1, vx / CFG.playerMaxSpeed)) * 0.2;
    if (dead) ctx.rotate(Math.min(deadT * 7, 1) * (Math.PI / 2) * deadDir);
    else ctx.rotate(lean);
    strokeStyle(2.6);
    const moving = Math.abs(vx) > 20 && !dead;
    const a = moving ? Math.sin(phase) * 0.75 : 0.14;
    const b = moving ? -a : (dead ? 0.5 : 0.4);
    const bob = moving ? Math.abs(Math.sin(phase)) * 1.5 : 0;
    ctx.translate(0, -bob);
    ctx.beginPath();
    ctx.moveTo(0, -24); ctx.lineTo(0, -13);                         // 몸통
    ctx.moveTo(0, -13); ctx.lineTo(Math.sin(a) * 13, -13 + Math.cos(a) * 13);   // 다리
    ctx.moveTo(0, -13); ctx.lineTo(-Math.sin(a) * 13, -13 + Math.cos(a) * 13);
    ctx.moveTo(0, -22); ctx.lineTo(Math.sin(b) * 11, -22 + Math.cos(b) * 11);   // 팔
    ctx.moveTo(0, -22); ctx.lineTo(-Math.sin(b) * 11, -22 + Math.cos(b) * 11);
    ctx.stroke();
    ctx.fillStyle = C.bg; ctx.beginPath(); ctx.arc(0, -30, 6.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();  // 머리
    strokeStyle(1.6);
    ctx.beginPath();
    if (dead) {                                                      // X 눈
      ctx.moveTo(-3.6, -32); ctx.lineTo(-1.2, -29.6); ctx.moveTo(-1.2, -32); ctx.lineTo(-3.6, -29.6);
      ctx.moveTo(1.2, -32); ctx.lineTo(3.6, -29.6); ctx.moveTo(3.6, -32); ctx.lineTo(1.2, -29.6);
    } else {
      const ex = Math.max(-1, Math.min(1, vx / 400)) * 1.4;
      ctx.moveTo(-2.4 + ex, -31); ctx.lineTo(-2.4 + ex, -29.6);
      ctx.moveTo(2.4 + ex, -31); ctx.lineTo(2.4 + ex, -29.6);
    }
    ctx.stroke();
    ctx.restore();
  }

  function render() {
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - 0.5) * shake * 18, (Math.random() - 0.5) * shake * 18);

    // 바닥선
    strokeStyle(2); ctx.beginPath(); ctx.moveTo(0, gy + 1); ctx.lineTo(W, gy + 1); ctx.stroke();
    ctx.globalAlpha = 0.35; strokeStyle(1.4); ctx.beginPath();
    for (let x = 10; x < W; x += 38) { ctx.moveTo(x, gy + 8); ctx.lineTo(x + 12, gy + 8); }
    ctx.stroke(); ctx.globalAlpha = 1;

    // 바닥에 떨어진 똥 자국
    for (const sp of splats) {
      ctx.globalAlpha = Math.max(0, 1 - sp.age / 1.6);
      strokeStyle(1.8); ctx.fillStyle = C.poop;
      ctx.beginPath(); ctx.ellipse(sp.x, gy - 2, sp.w / 2, 4.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    ctx.globalAlpha = 1;

    for (const p of poops) drawPoop(p);
    drawPlayer();

    // 맞았을 때 파편
    for (const q of parts) {
      ctx.globalAlpha = Math.max(0, 1 - q.age / q.life);
      ctx.strokeStyle = C.hit; ctx.lineWidth = 2.4; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(q.x - q.vx * 0.04, q.y - q.vy * 0.04); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  /* ---------- 메인 루프 ---------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000 || 0.016); last = now;
    if (state !== "pause") update(dt);
    render();
    requestAnimationFrame(frame);
  }

  /* ---------- 시작 ---------- */
  $("soundBtn").addEventListener("click", () => {
    audioInit(); muted = !muted; applyMute(); paintSound();
    try { localStorage.setItem(MUTE_KEY, muted ? "1" : "0"); } catch (e) {}
  });
  readColors(); resize(); $("tBest").textContent = fmt(best); paintSound(); showReady();
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
